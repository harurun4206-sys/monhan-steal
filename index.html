      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('▶ クリックで出撃！', r.x + r.w - 16, r.y + 68);
    }
    ctx.textAlign = 'left';
  }

  ctx.fillStyle = '#999';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('※戦闘中でも Mキー でいつでもこのクエスト選択画面に戻れます', canvas.width / 2, canvas.height - 26);
  ctx.textAlign = 'left';

  ctx.restore();
}

function drawWeaknessGuide() {
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const singleMonsters = QUEST_LIST.filter(q => !q.isMultiTarget);
  const totalPages = Math.max(1, Math.ceil(singleMonsters.length / WEAKNESS_PER_PAGE));
  if (weaknessPage >= totalPages) weaknessPage = 0;

  const pageStart = weaknessPage * WEAKNESS_PER_PAGE;
  const pageMonsters = singleMonsters.slice(pageStart, pageStart + WEAKNESS_PER_PAGE);

  const rowH = 42;
  const boxW = 820;
  const boxH = 148 + WEAKNESS_PER_PAGE * rowH;
  const boxX = (canvas.width - boxW) / 2;
  const boxY = (canvas.height - boxH) / 2;

  ctx.fillStyle = '#191714';
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 3;
  ctx.strokeRect(boxX, boxY, boxW, boxH);

  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('【 ハンターノート：全モンスター属性肉質表 】', boxX + 22, boxY + 34);

  // 右上にページ数表示
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`◀  ${weaknessPage + 1} / ${totalPages} ページ  ▶`, boxX + boxW - 22, boxY + 34);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#ccc';
  ctx.font = '12px sans-serif';
  ctx.fillText('数値が高いほど有効（50:大弱点 / 40:弱点 / 30:普通 / 25:耐性 / 10:大耐性 / ✕:無効）', boxX + 24, boxY + 55);

  const tableX = boxX + 22;
  const tableY = boxY + 66;
  const colWidths = [276, 100, 100, 100, 100, 100];
  const headers = [
    { label: 'モンスター（難易度）', color: '#ffd700' },
    { label: '火属性', color: '#ff7043' },
    { label: '水属性', color: '#4fc3f7' },
    { label: '雷属性', color: '#ffee58' },
    { label: '氷属性', color: '#80deea' },
    { label: '龍属性', color: '#ea80fc' }
  ];

  ctx.fillStyle = '#2c261f';
  ctx.fillRect(tableX, tableY, colWidths.reduce((a, b) => a + b, 0), 34);
  ctx.strokeStyle = '#6d583e';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(tableX, tableY, colWidths.reduce((a, b) => a + b, 0), 34);

  let curX = tableX;
  headers.forEach((h, i) => {
    ctx.fillStyle = h.color;
    ctx.font = 'bold 15px sans-serif';
    if (i === 0) {
      ctx.fillText(h.label, curX + 12, tableY + 23);
    } else {
      ctx.textAlign = 'center';
      ctx.fillText(h.label, curX + colWidths[i] / 2, tableY + 23);
      ctx.textAlign = 'left';
    }
    curX += colWidths[i];
  });

  const elemKeys = ['fire', 'water', 'thunder', 'ice', 'dragon'];
  const totalW = colWidths.reduce((a, b) => a + b, 0);

  for (let rowIdx = 0; rowIdx < WEAKNESS_PER_PAGE; rowIdx++) {
    const rowY = tableY + 34 + rowIdx * rowH;
    const q = pageMonsters[rowIdx];

    if (!q) {
      ctx.fillStyle = rowIdx % 2 === 0 ? '#1b1814' : '#161310';
      ctx.fillRect(tableX, rowY, totalW, rowH);
      ctx.strokeStyle = '#2d261e';
      ctx.lineWidth = 1;
      ctx.strokeRect(tableX, rowY, totalW, rowH);
      continue;
    }

    const isCurrentTarget = gameState === 'playing' && activeMonsters.some(m => m.hp > 0 && m.species === q.key);
    ctx.fillStyle = isCurrentTarget
      ? 'rgba(255, 215, 0, 0.14)'
      : (rowIdx % 2 === 0 ? '#201c18' : '#181512');
    ctx.fillRect(tableX, rowY, totalW, rowH);
    ctx.strokeStyle = '#3d3328';
    ctx.lineWidth = 1;
    ctx.strokeRect(tableX, rowY, totalW, rowH);

    const monsterNames = {
      rathalos: '火竜 リオレウス',
      rathian: '雌火竜 リオレイア',
      zinogre: '雷狼竜 ジンオウガ',
      tobi: '飛雷竜 トビカガチ',
      gore: '黒蝕竜 ゴア・マガラ',
      barioth: '氷牙竜 ベリオロス',
      mizutsune: '泡狐竜 タマミツネ',
      kirin: '幻獣 キリン'
    };
    const mName = q.displayName || monsterNames[q.key] || q.title;

    ctx.fillStyle = isCurrentTarget ? '#ffd700' : '#fff';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`${mName} (${q.stars})`, tableX + 12, rowY + rowH * 0.65);

    let cellX = tableX + colWidths[0];
    const table = ELEMENT_EFFECTIVENESS[q.key] || { fire: 1, water: 1, thunder: 1, ice: 1, dragon: 1 };
    elemKeys.forEach((ek, ei) => {
      const mult = table[ek];
      const valText = formatHitzoneDisplay(mult);

      let valColor = '#cfd8dc';
      if (valText === '50') valColor = '#ff5252';
      else if (valText === '40') valColor = '#ffd740';
      else if (valText === '30') valColor = '#ffffff';
      else if (valText === '25') valColor = '#90a4ae';
      else if (valText === '10') valColor = '#607d8b';
      else if (valText === '✕') valColor = '#ef5350';

      ctx.fillStyle = valColor;
      ctx.font = valText === '50' || valText === '40' ? 'bold 18px sans-serif' : 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(valText, cellX + colWidths[ei + 1] / 2, rowY + rowH * 0.66);
      ctx.textAlign = 'left';

      cellX += colWidths[ei + 1];
    });
  }

  ctx.fillStyle = '#ccc';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('← / →（A / D）: ページ切替 ｜ F2キー または Escキー で閉じる', canvas.width / 2, boxY + boxH - 14);
  ctx.textAlign = 'left';

  ctx.restore();
}

function drawBariothAttacks() {
  iceBeams.forEach(beam => {
    ctx.save();
    const alpha = beam.life / beam.maxLife;
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 16;

    ctx.strokeStyle = `rgba(77, 208, 225, ${alpha * 0.85})`;
    ctx.lineWidth = 22 * alpha + 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(beam.x1, beam.y1);
    ctx.lineTo(beam.x2, beam.y2);
    ctx.stroke();

    ctx.strokeStyle = `rgba(224, 247, 250, ${alpha})`;
    ctx.lineWidth = 9 * alpha + 2;
    ctx.beginPath();
    ctx.moveTo(beam.x1, beam.y1);
    ctx.lineTo(beam.x2, beam.y2);
    ctx.stroke();

    ctx.fillStyle = `rgba(178, 235, 242, ${alpha * 0.8})`;
    ctx.beginPath();
    ctx.arc(beam.x2, beam.y2 - 6, 24 * alpha, Math.PI, 0);
    ctx.fill();
    ctx.restore();
  });

  iceSpears.forEach(spear => {
    ctx.save();
    const isCharging = spear.windupTimer > 0;
    const midY = spear.y + spear.h / 2;

    if (isCharging) {
      ctx.strokeStyle = 'rgba(128, 222, 234, 0.28)';
      ctx.setLineDash([10, 8]);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, midY);
      ctx.lineTo(canvas.width, midY);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = isCharging ? 8 : 14;
    ctx.fillStyle = isCharging ? 'rgba(128, 222, 234, 0.78)' : '#4dd0e1';

    ctx.beginPath();
    if (spear.dir === 1) {
      ctx.moveTo(spear.x, midY - 6);
      ctx.lineTo(spear.x + spear.w - 28, spear.y);
      ctx.lineTo(spear.x + spear.w, midY);
      ctx.lineTo(spear.x + spear.w - 28, spear.y + spear.h);
      ctx.lineTo(spear.x, midY + 6);
    } else {
      ctx.moveTo(spear.x + spear.w, midY - 6);
      ctx.lineTo(spear.x + 28, spear.y);
      ctx.lineTo(spear.x, midY);
      ctx.lineTo(spear.x + 28, spear.y + spear.h);
      ctx.lineTo(spear.x + spear.w, midY + 6);
    }
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#e0f7fa';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(spear.x + 14, midY);
    ctx.lineTo(spear.x + spear.w - 14, midY);
    ctx.stroke();

    ctx.restore();
  });
}

function drawFrenzySpreadClouds() {
  frenzySpreadClouds.forEach(cloud => {
    ctx.save();
    const fade = Math.min(1, cloud.timer / 30);
    const centerX = cloud.x + cloud.w / 2;

    const grad = ctx.createLinearGradient(0, cloud.y, 0, GROUND_Y);
    grad.addColorStop(0, `rgba(170, 0, 255, ${0.08 * fade})`);
    grad.addColorStop(1, `rgba(106, 27, 154, ${0.58 * fade})`);
    ctx.fillStyle = grad;
    ctx.fillRect(cloud.x, cloud.y, cloud.w, cloud.h);

    ctx.fillStyle = `rgba(224, 64, 251, ${0.75 * fade})`;
    ctx.fillRect(cloud.x, GROUND_Y - 4, cloud.w, 4);

    const puffs = Math.floor(cloud.w / 32);
    for (let j = 0; j <= puffs; j++) {
      const px = cloud.x + (cloud.w / puffs) * j;
      const waveY = Math.sin(Date.now() * 0.008 + j) * 4;
      ctx.fillStyle = `rgba(142, 36, 170, ${0.32 * fade})`;
      ctx.beginPath();
      ctx.arc(px, GROUND_Y - 12 + waveY, 18, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = `rgba(243, 229, 245, ${0.45 * fade})`;
    const ratio = cloud.timer / cloud.maxTimer;
    ctx.fillRect(centerX - 24 * ratio, cloud.y - 6, 48 * ratio, 2);

    ctx.restore();
  });
}

function drawFrenzyBombs() {
  frenzyOrbs.forEach(orb => {
    ctx.save();
    const urgency = 1 - (orb.timer / 90);
    const pulseR = orb.r + Math.sin(orb.timer * 0.35) * 3 + urgency * 7;

    ctx.fillStyle = `rgba(170, 0, 255, ${0.15 + urgency * 0.25})`;
    ctx.fillRect(orb.x - 52, GROUND_Y - 5, 104, 5);

    ctx.shadowColor = '#d500f9';
    ctx.shadowBlur = 12 + urgency * 14;
    ctx.beginPath();
    ctx.arc(orb.x, orb.y, pulseR, 0, Math.PI * 2);
    ctx.fillStyle = '#4a148c';
    ctx.fill();

    if (orb.timer > 24 || Math.floor(orb.timer / 3) % 2 === 0) {
      ctx.beginPath();
      ctx.arc(orb.x, orb.y, pulseR * 0.58, 0, Math.PI * 2);
      ctx.fillStyle = '#e040fb';
      ctx.fill();
    }
    ctx.restore();
  });

  frenzyExplosions.forEach(exp => {
    ctx.save();
    const alpha = exp.life / 16;
    ctx.fillStyle = `rgba(170, 0, 255, ${alpha * 0.65})`;
    ctx.beginPath();
    ctx.arc(exp.x, exp.y, exp.r * (1.15 - alpha * 0.25), 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(243, 229, 245, ${alpha * 0.85})`;
    ctx.beginPath();
    ctx.arc(exp.x, exp.y, exp.r * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawLightningClouds() {
  lightningClouds.forEach(lc => {
    ctx.save();
    const urgency = 1 - (lc.timer / 90);

    ctx.fillStyle = `rgba(128, 216, 255, ${0.12 + urgency * 0.25})`;
    ctx.fillRect(lc.x - 20, GROUND_Y - 4, 40, 4);

    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 10 + urgency * 12;
    ctx.fillStyle = '#37474f';
    ctx.beginPath();
    ctx.arc(lc.x - 16, lc.y + 4, 15, 0, Math.PI * 2);
    ctx.arc(lc.x, lc.y - 2, 19, 0, Math.PI * 2);
    ctx.arc(lc.x + 16, lc.y + 4, 15, 0, Math.PI * 2);
    ctx.fill();

    if (lc.timer > 25 || Math.floor(lc.timer / 3) % 2 === 0) {
      ctx.fillStyle = `rgba(179, 229, 252, ${0.35 + urgency * 0.5})`;
      ctx.beginPath();
      ctx.arc(lc.x, lc.y + 3, 12, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });
}

function drawLightningBolts() {
  lightningBolts.forEach(lb => {
    ctx.save();
    const alpha = lb.life / 14;
    ctx.strokeStyle = `rgba(128, 216, 255, ${alpha})`;
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(lb.x, lb.topY);
    ctx.lineTo(lb.x - 8, (lb.topY + lb.bottomY) * 0.35);
    ctx.lineTo(lb.x + 8, (lb.topY + lb.bottomY) * 0.68);
    ctx.lineTo(lb.x, lb.bottomY);
    ctx.stroke();

    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.restore();
  });
}

function drawPlayer() {
  ctx.save();
  if (player.invulnTimer > 0 && Math.floor(player.invulnTimer / 3) % 2 === 0) {
    ctx.globalAlpha = 0.5;
  }

  const paraJitter = player.paralysisTimer > 0 ? (Math.random() - 0.5) * 4 : 0;
  const px = player.x + paraJitter;
  const py = player.y;

  const headItem = ARMOR_DB.head[player.equipment.head];
  const chestItem = ARMOR_DB.chest[player.equipment.chest];
  const armsItem = ARMOR_DB.arms[player.equipment.arms];
  const waistItem = ARMOR_DB.waist[player.equipment.waist];
  const legsItem = ARMOR_DB.legs[player.equipment.legs];

  if (chestItem.series === 'mizutsune') {
    ctx.fillStyle = '#fce4ec';
    ctx.fillRect(px + 5, py - 45, 20, 28);
    ctx.fillStyle = '#ec407a';
    ctx.fillRect(px + 5, py - 45, 20, 6);
  } else if (chestItem.series === 'kirin') {
    ctx.fillStyle = '#eceff1';
    ctx.fillRect(px + 5, py - 45, 20, 26);
    ctx.fillStyle = '#4fc3f7';
    ctx.fillRect(px + 5, py - 45, 20, 5);

    ctx.fillStyle = '#9e1c1c';
    ctx.fillRect(px + 5, py - 45, 20, 30);
    ctx.fillStyle = '#d4af37';
    ctx.fillRect(px + 5, py - 45, 20, 6);
  } else if (chestItem.series === 'hunter') {
    ctx.fillStyle = '#4e6e48';
    ctx.fillRect(px + 5, py - 45, 20, 30);
    ctx.fillStyle = '#8d6e63';
    ctx.fillRect(px + 5, py - 45, 20, 6);
  } else {
    ctx.fillStyle = '#d2a679';
    ctx.fillRect(px + 5, py - 45, 20, 30);
  }

  if (armsItem.series === 'mizutsune') {
    ctx.fillStyle = '#f8bbd0';
    ctx.fillRect(px + (player.facing === 1 ? 18 : 4), py - 38, 8, 14);
  } else if (armsItem.series === 'kirin') {
    ctx.fillStyle = '#e1f5fe';
    ctx.fillRect(px + (player.facing === 1 ? 18 : 4), py - 38, 8, 14);
  } else if (armsItem.series === 'rathalos') {
    ctx.fillStyle = '#b71c1c';
    ctx.fillRect(px + (player.facing === 1 ? 18 : 4), py - 38, 8, 14);
  } else if (armsItem.series === 'hunter') {
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(px + (player.facing === 1 ? 18 : 4), py - 38, 8, 14);
  }

  if (waistItem.series === 'mizutsune') {
    ctx.fillStyle = '#ad1457';
    ctx.fillRect(px + 3, py - 19, 24, 6);
  } else if (waistItem.series === 'kirin') {
    ctx.fillStyle = '#b3e5fc';
    ctx.fillRect(px + 3, py - 19, 24, 6);
  } else if (waistItem.series === 'rathalos') {
    ctx.fillStyle = '#880e0e';
    ctx.fillRect(px + 4, py - 18, 22, 6);
  } else if (waistItem.series === 'hunter') {
    ctx.fillStyle = '#6d4c41';
    ctx.fillRect(px + 4, py - 18, 22, 6);
  }

  if (legsItem.series === 'mizutsune') {
    ctx.fillStyle = '#f48fb1';
  } else if (legsItem.series === 'kirin') {
    ctx.fillStyle = '#cfd8dc';
  } else if (legsItem.series === 'rathalos') {
    ctx.fillStyle = '#7f1414';
  } else if (legsItem.series === 'hunter') {
    ctx.fillStyle = '#3e5638';
  } else {
    ctx.fillStyle = '#3b4252';
  }
  ctx.fillRect(px + 6, py - 15, 18, 15);

  ctx.fillStyle = '#e5c29f';
  ctx.beginPath();
  ctx.arc(px + 15, py - 53, 9, 0, Math.PI * 2);
  ctx.fill();
  if (headItem.series === 'mizutsune') {
    ctx.fillStyle = '#fce4ec';
    ctx.beginPath();
    ctx.arc(px + 15, py - 54, 10, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#ec407a';
    ctx.fillRect(px + 7, py - 63, 4, 5);
    ctx.fillRect(px + 19, py - 63, 4, 5);
  } else if (headItem.series === 'kirin') {
    ctx.fillStyle = '#eceff1';
    ctx.fillRect(px + 6, py - 59, 18, 5);
    ctx.fillStyle = '#29b6f6';
    ctx.beginPath();
    const hornBase = px + 15 + player.facing * 4;
    ctx.moveTo(hornBase - 2, py - 59);
    ctx.lineTo(hornBase + player.facing * 8, py - 71);
    ctx.lineTo(hornBase + 2, py - 59);
    ctx.fill();
  } else if (headItem.series === 'rathalos') {

  const isDB = player.weaponType === 'dualblades';
  const handX = px + 15;

    ctx.roundRect(rx + 12, ry - rh + 25, rw - 24, rh - 38, 12);
    ctx.fill();

    ctx.fillStyle = m.isCharged ? '#e0f7fa' : '#cfd8dc';
    ctx.beginPath();
    ctx.moveTo(rx + 25, ry - rh + 25);
    ctx.lineTo(rx + 42, ry - rh + 8);
    ctx.lineTo(rx + 58, ry - rh + 25);
    ctx.lineTo(rx + 74, ry - rh + 10);
    ctx.lineTo(rx + 88, ry - rh + 25);
    ctx.fill();

    ctx.strokeStyle = '#006064';
    ctx.lineWidth = 14;
    ctx.beginPath();
    const tailBaseX = m.facing === 1 ? rx + 14 : rx + rw - 14;
    ctx.moveTo(tailBaseX, ry - 32);
    ctx.lineTo(tailBaseX - m.facing * 68, ry - 48 + Math.sin(Date.now() * 0.008) * 8);
    ctx.stroke();

    const headX = m.facing === 1 ? rx + rw - 28 : rx - 8;
    ctx.fillStyle = m.flashTimer > 0 ? '#ffffff' : '#0097a7';
    ctx.fillRect(headX, ry - rh + 14, 36, 26);

    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.moveTo(headX + (m.facing === 1 ? 8 : 28), ry - rh + 14);
    ctx.lineTo(headX + (m.facing === 1 ? -6 : 42), ry - rh - 2);
    ctx.lineTo(headX + (m.facing === 1 ? 18 : 18), ry - rh + 14);
    ctx.fill();

    ctx.fillStyle = '#ffee58';
    ctx.fillRect(m.facing === 1 ? headX + 22 : headX + 8, ry - rh + 20, 6, 5);

    if (m.state === 'thunderClaw') {
      ctx.fillStyle = '#00e5ff';
      ctx.beginPath();
      ctx.arc(m.facing === 1 ? rx + rw - 15 : rx + 15, ry - 20, 14, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#004d40';
    ctx.fillRect(rx + 24, ry - 18, 16, 18);
    ctx.fillRect(rx + rw - 40, ry - 18, 16, 18);

    ctx.restore();
    return;
  }

  // リオレウス / リオレイア
  const isRathian = sp === 'rathian';
  const wingColor = isRathian ? '#1e4620' : '#6e1414';
  const bodyColor = isRathian ? '#2e7d32' : '#a81c1c';
  const tailColor = isRathian ? '#4a148c' : '#801313';
  const headColor = isRathian ? '#388e3c' : '#c02222';

  const wingFlap = Math.sin(Date.now() * 0.015) * (m.isFlying ? 25 : 8);
  ctx.fillStyle = wingColor;
  ctx.beginPath();
  ctx.moveTo(rx + rw / 2, ry - rh + 25);
  ctx.lineTo(rx + rw / 2 - m.facing * 75, ry - rh - 30 + wingFlap);
  ctx.lineTo(rx + rw / 2 - m.facing * 20, ry - rh + 45);
  ctx.fill();

  ctx.fillStyle = m.flashTimer > 0 ? '#ffffff' : bodyColor;
  ctx.beginPath();
  ctx.roundRect(rx + 15, ry - rh + 20, rw - 30, rh - 30, 15);
  ctx.fill();

  ctx.strokeStyle = tailColor;
  ctx.lineWidth = 10;
  ctx.beginPath();
  const tailBaseX = m.facing === 1 ? rx + 15 : rx + rw - 15;
  ctx.moveTo(tailBaseX, ry - 30);
  if (m.state === 'poisonTail') {
    const tailTipX = tailBaseX - m.facing * 75;
    const tailTipY = ry - 20;
    ctx.lineTo(tailTipX, tailTipY);
    ctx.stroke();
    ctx.fillStyle = '#c94bff';
    ctx.beginPath();
    ctx.arc(tailTipX, tailTipY, 10, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.lineTo(tailBaseX - m.facing * 65, ry - 45 + Math.sin(Date.now() * 0.008) * 10);
    ctx.stroke();
  }

  const headX = m.facing === 1 ? rx + rw - 25 : rx - 10;
  ctx.fillStyle = m.flashTimer > 0 ? '#ffffff' : headColor;
  ctx.fillRect(headX, ry - rh + 10, 35, 28);

  ctx.fillStyle = '#ffcc00';
  ctx.fillRect(m.facing === 1 ? headX + 20 : headX + 8, ry - rh + 16, 6, 5);

  if (m.state === 'fireball' && m.stateTimer > 25) {
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.arc(m.facing === 1 ? headX + 35 : headX, ry - rh + 26, 10, 0, Math.PI * 2);
    ctx.fill();
  } else if (m.state === 'poisonShot' && m.stateTimer > 25) {
    ctx.fillStyle = '#b829ff';
    ctx.beginPath();
    ctx.arc(m.facing === 1 ? headX + 35 : headX, ry - rh + 26, 10, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#4a3525';
  ctx.fillRect(rx + 30, ry - 15, 14, 15);
  ctx.fillRect(rx + rw - 44, ry - 15, 14, 15);

  ctx.restore();
}

function drawEquipMenu() {
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const boxW = 810;
  const boxH = 435;
  const boxX = (canvas.width - boxW) / 2;
  const boxY = (canvas.height - boxH) / 2;

  ctx.fillStyle = '#1d1a16';
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = '#c89d54';
  ctx.lineWidth = 3;
  ctx.strokeRect(boxX, boxY, boxW, boxH);

  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText('【 装備変更 】', boxX + 24, boxY + 36);

  const totalAtk = getTotalAttack();
  const totalDef = getTotalDefense();
  const totalFireRes = getTotalFireRes();
  const totalWaterRes = getTotalWaterRes();
  const totalThunderRes = getTotalThunderRes();
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#4fc3f7';
  ctx.fillText(`雷:+${totalThunderRes}${totalThunderRes >= 20 ? '(無)' : ''}`, boxX + boxW - 18, boxY + 36);
  ctx.fillStyle = '#81d4fa';
  ctx.fillText(`水:+${totalWaterRes} ｜`, boxX + boxW - 115, boxY + 36);
  ctx.fillStyle = '#ff8a65';
  ctx.fillText(`火:+${totalFireRes}${totalFireRes >= 20 ? '(無)' : ''} ｜`, boxX + boxW - 190, boxY + 36);
  ctx.fillStyle = '#80e27e';
  ctx.fillText(`防御:${totalDef} ｜`, boxX + boxW - 290, boxY + 36);
  ctx.fillStyle = '#ffd54f';
  ctx.fillText(`攻撃:${totalAtk} ｜`, boxX + boxW - 375, boxY + 36);
  ctx.textAlign = 'left';

  ctx.strokeStyle = '#554734';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(boxX + 20, boxY + 50);
  ctx.lineTo(boxX + boxW - 20, boxY + 50);
  ctx.stroke();

  EQUIP_SLOTS.forEach((slot, i) => {
    const rowY = boxY + 86 + i * 42;
    const isSelected = i === equipCursor;

    if (isSelected) {
      ctx.fillStyle = 'rgba(255, 215, 0, 0.16)';
      ctx.fillRect(boxX + 20, rowY - 25, boxW - 40, 33);
      ctx.strokeStyle = '#ffd700';
      ctx.strokeRect(boxX + 20, rowY - 25, boxW - 40, 33);
    }

    ctx.fillStyle = isSelected ? '#ffd700' : '#bbb';
    ctx.font = 'bold 17px sans-serif';
    ctx.fillText(`${isSelected ? '▶ ' : '  '}${slot.label}：`, boxX + 30, rowY - 3);

    if (slot.key === 'weapon') {
      const wpn = getCurrentWeapon();
      const typeLabel = getWeaponTypeLabel();
      const isThunder = wpn.element === 'thunder';
      const isFire = wpn.element === 'fire';
      const isWater = wpn.element === 'water';
      const isIce = wpn.element === 'ice';
      const isDragon = wpn.element === 'dragon';
      const elemBonus = getElementSkillBonus(wpn.element);

      ctx.fillStyle = '#ffb74d';
      ctx.fillText(`[${typeLabel}]`, boxX + 115, rowY - 3);

      ctx.fillStyle = isDragon ? '#ea80fc'
        : (isIce ? '#80deea'
          : (isWater ? '#4fc3f7'
            : (isThunder ? '#4dd0e1'
              : (isFire ? '#ff7043' : '#fff'))));
      ctx.fillText(`◀ ${wpn.name} ▶`, boxX + 185, rowY - 3);

      ctx.font = '14px sans-serif';
      ctx.fillStyle = isDragon ? '#f3e5f5'
        : (isIce ? '#b2ebf2'
          : (isWater ? '#81d4fa'
            : (isThunder ? '#80ffff'
              : (isFire ? '#ffab91' : '#aaa'))));
      ctx.fillText(`属性: ${wpn.elementLabel}${elemBonus > 0 ? `(+${elemBonus})` : ''}`, boxX + 445, rowY - 3);

      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffd54f';
      ctx.fillText(`攻撃力 ${wpn.attack + elemBonus}`, boxX + boxW - 26, rowY - 3);
      ctx.textAlign = 'left';
    } else {
      const itemIdx = player.equipment[slot.key];
      const item = ARMOR_DB[slot.key][itemIdx];
      const skillStr = formatSkillsText(item.skills);

      ctx.fillStyle = item.series === 'mizutsune'
        ? '#f48fb1'
        : (item.series === 'kirin'
          ? '#80d8ff'
          : (item.series === 'rathalos' ? '#ff8a80' : (item.def > 0 ? '#fff' : '#888')));
      ctx.fillText(`◀ ${item.name} ▶`, boxX + 125, rowY - 3);

      ctx.font = '13px sans-serif';
      ctx.fillStyle = skillStr ? '#4fc3f7' : '#666';
      ctx.fillText(skillStr || '-', boxX + 335, rowY - 3);

      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillStyle = item.def > 0 ? '#80e27e' : '#777';
      ctx.fillText(`防+${item.def}`, boxX + boxW - 205, rowY - 3);

      ctx.fillStyle = (item.fireRes || 0) > 0 ? '#ff8a65' : '#666';
      ctx.fillText(`火+${item.fireRes || 0}`, boxX + boxW - 145, rowY - 3);

      ctx.fillStyle = (item.waterRes || 0) > 0 ? '#81d4fa' : '#666';
      ctx.fillText(`水+${item.waterRes || 0}`, boxX + boxW - 85, rowY - 3);

      ctx.fillStyle = (item.thunderRes || 0) > 0 ? '#4fc3f7' : '#666';
      ctx.fillText(`雷+${item.thunderRes || 0}`, boxX + boxW - 25, rowY - 3);
      ctx.textAlign = 'left';
    }
  });

  const activeSkillsStr = formatSkillsText(getActiveSkills());
  ctx.fillStyle = '#2a241d';
  ctx.fillRect(boxX + 20, boxY + 340, boxW - 40, 32);
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#ffd54f';
  ctx.fillText(`発動スキル: ${activeSkillsStr || 'なし'}`, boxX + 32, boxY + 361);

  ctx.fillStyle = '#ccc';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('↑↓: 部位選択 ｜ ←→: 装備切替 ｜ Enter(武器欄): 武器種変更 ｜ Ctrl/Esc: 閉じる', canvas.width / 2, boxY + boxH - 16);
  ctx.textAlign = 'left';

  ctx.restore();
}

function getSpeciesDisplayName(m) {
  const extraQ = (EXTRA.quests || []).find(q => q.key === m.species);
  if (extraQ && extraQ.displayName) return extraQ.displayName;

  switch (m.species) {
    case 'rathalos': return '火竜 リオレウス';
    case 'rathian': return '雌火竜 リオレイア';
    case 'zinogre': return '雷狼竜 ジンオウガ';
    case 'tobi': return '飛雷竜 トビカガチ';
    case 'kirin': return '幻獣 キリン';
    case 'gore': return `黒蝕竜 ゴア・マガラ${m.isFrenzied ? '【狂竜化】' : ''}`;
    case 'barioth': return '氷牙竜 ベリオロス';
    case 'mizutsune': return '泡狐竜 タマミツネ';
    default: return 'モンスター';
  }
}

function getSpeciesBarColor(m) {
  const extraQ = (EXTRA.quests || []).find(q => q.key === m.species);
  if (extraQ && extraQ.barColor) return extraQ.barColor;

  switch (m.species) {
    case 'rathalos': return '#c0392b';
    case 'rathian': return '#27ae60';
    case 'zinogre': return '#00acc1';
    case 'tobi': return '#fbc02d';
    case 'kirin': return '#4fc3f7';
    case 'gore': return m.isFrenzied ? '#d500f9' : '#6a1b9a';
    case 'barioth': return '#4dd0e1';
    case 'mizutsune': return '#ec407a';
    default: return '#c0392b';
  }
}

function drawUI() {
  // プレイヤーHPバー
  ctx.fillStyle = '#222';
  ctx.fillRect(20, 20, 250, 16);
  ctx.fillStyle = player.paralysisTimer > 0
    ? '#f1c40f'
    : (player.poisonTimer > 0
      ? '#9b59b6'
      : (player.burnTimer > 0
        ? '#ff6600'
        : (player.thunderBlightTimer > 0
          ? '#00bcd4'
          : (player.bubbleTimer > 0 ? '#f48fb1' : '#2ecc71'))));
  ctx.fillRect(20, 20, 250 * (player.hp / player.maxHp), 16);
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(20, 20, 250, 16);

  // スタミナバー
  ctx.fillStyle = '#222';
  ctx.fillRect(20, 40, 200, 10);
  ctx.fillStyle = player.demonMode ? '#ff1744' : '#f1c40f';
  ctx.fillRect(20, 40, 200 * (player.stamina / player.maxStamina), 10);

  // 武器種別ゲージ
  const isCustomWeapon = (EXTRA.weaponTypes || []).some(t => t.key === player.weaponType);
  const isGS = player.weaponType === 'greatsword';
  const isDB = player.weaponType === 'dualblades';
  if (isCustomWeapon && typeof EXTRA_HOOKS.onDrawWeaponUI === 'function') {
    EXTRA_HOOKS.onDrawWeaponUI(getHookContext());
  } else if (isGS) {
    const maxChargeF = getMaxChargeFrames();
    const chargeFill = player.state === 'gsCharge' ? Math.min(1, player.chargeFrames / maxChargeF) : 0;
    const chargeBarColors = ['#90a4ae', '#ffffff', '#ffd700', '#ff3d00'];
    ctx.fillStyle = '#222';
    ctx.fillRect(20, 56, 180, 12);
    ctx.fillStyle = chargeBarColors[player.chargeLevel];
    ctx.fillRect(20, 56, 180 * chargeFill, 12);
    ctx.strokeStyle = player.chargeLevel > 0 ? chargeBarColors[player.chargeLevel] : '#888';
    ctx.lineWidth = player.chargeLevel > 0 ? 2.5 : 1;
    ctx.strokeRect(20, 56, 180, 12);
    ctx.lineWidth = 1;
  } else if (isDB) {
    ctx.fillStyle = '#222';
    ctx.fillRect(20, 56, 180, 12);
    ctx.fillStyle = player.demonMode ? '#ff1744' : '#546e7a';
    ctx.fillRect(20, 56, player.demonMode ? 180 : 0, 12);
    ctx.strokeStyle = player.demonMode ? '#ff5252' : '#888';
    ctx.lineWidth = player.demonMode ? 2.5 : 1;
    ctx.strokeRect(20, 56, 180, 12);
    ctx.lineWidth = 1;
  } else {
    const auraGlow = ['transparent', '#ffffff', '#ffd700', '#ff2222'][player.spiritLevel];
    ctx.fillStyle = '#222';
    ctx.fillRect(20, 56, 180, 12);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(20, 56, 180 * (player.spirit / player.maxSpirit), 12);
    ctx.strokeStyle = player.spiritLevel > 0 ? auraGlow : '#888';
    ctx.lineWidth = player.spiritLevel > 0 ? 3 : 1;
    ctx.strokeRect(20, 56, 180, 12);
    ctx.lineWidth = 1;
  }

  // ステータス文字（常時2段表示：1段目に装備・武器、2段目に回復薬・回復薬グレート・解毒薬）
  const wpn = getCurrentWeapon();
  const typeLabel = getWeaponTypeLabel();
  const totalAtk = getTotalAttack();
  const bubblyTag = player.bubblyBuffTimer > 0 ? `【泡沫UP:${Math.ceil(player.bubblyBuffTimer / 60)}秒】` : '';
  const equipLine = `装備: ${getEquipSummaryText()} ｜ [${typeLabel}]${wpn.name}(攻${totalAtk}/${wpn.elementLabel})${bubblyTag}`;
  const itemLine = `回復薬(H):${player.potions}  回復薬グレート(B):${player.megaPotions}  解毒薬(G):${player.antidotes}`;

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText(equipLine, 20, 88);
  ctx.fillStyle = '#a5d6a7';
  ctx.fillText(itemLine, 20, 108);

  // モンスターHPバー描画
  const questInfo = QUEST_LIST.find(q => q.key === targetMonster);
  const starStr = questInfo ? `[${questInfo.stars}] ` : '';

  activeMonsters.forEach((m, idx) => {
    const barY = 20 + idx * 44;
    ctx.fillStyle = '#222';
    ctx.fillRect(530, barY, 350, 16);
    ctx.fillStyle = getSpeciesBarColor(m);
    ctx.fillRect(530, barY, 350 * (Math.max(0, m.hp) / m.maxHp), 16);
    ctx.strokeStyle = '#ffd700';
    ctx.strokeRect(530, barY, 350, 16);

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 13px sans-serif';
    const statusSuffix = m.hp <= 0 ? ' 【討伐完了】' : '';
    ctx.fillText(`${starStr}${getSpeciesDisplayName(m)}  HP: ${Math.max(0, m.hp)} / ${m.maxHp}${statusSuffix}`, 530, barY + 31);
  });

  // 勝敗判定
  const allDefeated = activeMonsters.every(m => m.hp <= 0) && (targetMonster !== 'raths_duo' || duoRathalosSpawned);
  if (allDefeated && gameState === 'playing') {
    gameState = 'win';
  } else if (player.hp <= 0 && gameState === 'playing') {
    gameState = 'lose';
  }

  if (gameState !== 'playing') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.font = 'bold 48px sans-serif';
    ctx.fillStyle = gameState === 'win' ? '#ffd700' : '#ff3333';
    ctx.fillText(gameState === 'win' ? 'QUEST CLEAR!（討伐完了）' : '力尽きました…', canvas.width / 2, canvas.height / 2 - 20);

    ctx.font = '20px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('Rキーで再挑戦 ｜ Mキーでクエスト選択画面へ', canvas.width / 2, canvas.height / 2 + 30);
    ctx.textAlign = 'left';
  }
}

function resetGame() {
  player.x = 180; player.y = GROUND_Y; player.hp = 100; player.stamina = 100;
  player.spirit = 0; player.spiritLevel = 0; player.chargeFrames = 0; player.chargeLevel = 0;
  player.demonMode = false; player.bubblyBuffTimer = 0;
  player.potions = 10; player.megaPotions = 10; player.antidotes = 10;
  player.burnTimer = 0; player.thunderBlightTimer = 0; player.bubbleTimer = 0; player.poisonTimer = 0; player.paralysisTimer = 0;
  player.frenzyCloudTick = 0;
  player.state = 'idle'; player.attackHitbox = null;
  isEquipMenuOpen = false;

  duoRathalosSpawned = false;
  if (targetMonster === 'raths_duo') {
    activeMonsters = [createMonsterEntity('rathian', 680)];
  } else {
    activeMonsters = [createMonsterEntity(targetMonster, 680)];
  }

  fireballs = []; poisonClouds = []; thunderOrbs = []; thunderWaves = [];
  waterJets = []; bubbleOrbs = [];
  lightningClouds = []; lightningBolts = [];
  frenzyOrbs = []; frenzyExplosions = []; frenzySpreadClouds = []; iceBeams = []; iceSpears = [];
  particles = []; floatingTexts = [];
  gameState = 'playing';

  if (typeof EXTRA_HOOKS.onResetGame === 'function') {
    EXTRA_HOOKS.onResetGame(getHookContext());
  }
}

function gameLoop() {
  if (gameState === 'playing' && !isEquipMenuOpen && !isWeaknessGuideOpen) {
    updatePlayer();
    activeMonsters.forEach(m => updateSingleMonster(m));
    updateFireballs();
    updatePoisonClouds();
    updateThunderOrbs();
    updateThunderWaves();
    updateMizutsuneAttacks();
    updateLightningClouds();
    updateFrenzyBombs();
    updateFrenzySpreadClouds();
    updateBariothAttacks();
    if (typeof EXTRA_HOOKS.onUpdateProjectiles === 'function') {
      EXTRA_HOOKS.onUpdateProjectiles(getHookContext());
    }
  }
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

// キー入力管理
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ControlLeft', 'ControlRight', 'F2', 'PageUp', 'PageDown'].includes(e.code)) {
    e.preventDefault();
  }
  handleActionInput(e.code);
});
window.addEventListener('keyup', e => keys[e.code] = false);

// マウス座標・クリック管理（クエスト選択画面用）
let mouseX = -1;
let mouseY = -1;
let hoveredQuestIndex = -1;
let hoveredPageBtn = -1; // 0: 前ページ, 1: 次ページ
let questPage = 0;
const QUESTS_PER_PAGE = 6;

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  mouseX = (e.clientX - rect.left) * scaleX;
  mouseY = (e.clientY - rect.top) * scaleY;
  updateHoveredQuest();
});

canvas.addEventListener('mouseleave', () => {
  mouseX = -1;
  mouseY = -1;
  hoveredQuestIndex = -1;
  hoveredPageBtn = -1;
});

canvas.addEventListener('click', e => {
  if (isWeaknessGuideOpen) return;
  if (isEquipMenuOpen) return;
  if (gameState !== 'questSelect') return;

  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  mouseX = (e.clientX - rect.left) * scaleX;
  mouseY = (e.clientY - rect.top) * scaleY;
  updateHoveredQuest();

  const totalPages = Math.ceil(QUEST_LIST.length / QUESTS_PER_PAGE);
  if (hoveredPageBtn === 0) {
    questPage = (questPage + totalPages - 1) % totalPages;
    updateHoveredQuest();
    return;
  }
  if (hoveredPageBtn === 1) {
    questPage = (questPage + 1) % totalPages;
    updateHoveredQuest();
    return;
  }

  if (hoveredQuestIndex >= 0 && hoveredQuestIndex < QUEST_LIST.length) {
    startQuest(QUEST_LIST[hoveredQuestIndex].key);
  }
});

function formatHitzoneDisplay(mult) {
  if (mult === 0) return '✕';
  if (mult >= 1.5) return '50';
  if (mult >= 1.25) return '40';
  if (mult === 1.0) return '30';
  if (mult >= 0.75) return '25';
  if (mult >= 0.25) return '10';
  return '10';
}

  if (!elementKey || elementKey === 'none') return 1.0;
  const table = ELEMENT_EFFECTIVENESS[monsterKey];
  if (!table || table[elementKey] === undefined) return 1.0;
  return table[elementKey];

  const list = WEAPON_DB[player.weaponType] || WEAPON_DB.longsword;
  const idx = player.weaponIndices[player.weaponType] || 0;
  return list[idx] || list[0] || { id: 'none', type: player.weaponType, name: '素手', element: 'none', elementLabel: '無属性', attack: 80 };
}

function getWeaponTypeLabel() {
  const found = WEAPON_TYPES.find(t => t.key === player.weaponType);
  return found ? found.label : '太刀';
}

function getAttackSkillBonus() {
  const skills = getActiveSkills();
  const lv = skills.attack || 0;
  if (lv <= 0) return 0;
  if (lv === 1) return 3;
  if (lv === 2) return 5;
  return 10;
}

function getElementSkillBonus(elementKey) {
  if (!elementKey || elementKey === 'none') return 0;
  const skillMap = {
    fire: 'fireAtk',
    water: 'waterAtk',
    thunder: 'thunderAtk',
    ice: 'iceAtk',
    dragon: 'dragonAtk'
  };
  const skillKey = skillMap[elementKey];
  if (!skillKey) return 0;
  const skills = getActiveSkills();
  const lv = skills[skillKey] || 0;
  if (lv <= 0) return 0;
  if (lv === 1) return 5;
  if (lv === 2) return 10;
  return 20;
}

function getThunderSkillBonus() {
  return getElementSkillBonus('thunder');
}

function getMaxChargeFrames() {
  const skills = getActiveSkills();
  const lv = skills.focus || 0;
  if (lv <= 0) return 76;
  if (lv === 1) return 108;
  if (lv === 2) return 90;
  return 60;
}

function getTotalAttack() {
  const wpn = getCurrentWeapon();
  const elemBonus = getElementSkillBonus(wpn.element);
  const rawAtk = wpn.attack + getAttackSkillBonus() + elemBonus;
  const bubblyMult = player.bubblyBuffTimer > 0 ? 1.05 : 1.0;
  return Math.round(rawAtk * bubblyMult);
}

function getTotalDefense() {
  let def = 0;
  for (const slot of ARMOR_SLOTS) {
    const idx = player.equipment[slot.key];
    def += ARMOR_DB[slot.key][idx].def;
  }
  return def;
}

function getTotalFireRes() {
  let res = 0;
  for (const slot of ARMOR_SLOTS) {
    const idx = player.equipment[slot.key];
    res += ARMOR_DB[slot.key][idx].fireRes || 0;
  }
  return res;
}

function getTotalWaterRes() {
  let res = 0;
  for (const slot of ARMOR_SLOTS) {
    const idx = player.equipment[slot.key];
    res += ARMOR_DB[slot.key][idx].waterRes || 0;
  }
  return res;
}

function getTotalThunderRes() {
  let res = 0;
  for (const slot of ARMOR_SLOTS) {
    const idx = player.equipment[slot.key];
    res += ARMOR_DB[slot.key][idx].thunderRes || 0;
  }
  return res;
}

function getActiveSkills() {
  const totals = {};
  for (const slot of ARMOR_SLOTS) {
    const idx = player.equipment[slot.key];
    const skills = ARMOR_DB[slot.key][idx].skills || {};
    for (const [k, v] of Object.entries(skills)) {
      totals[k] = (totals[k] || 0) + v;
    }
  }
  return totals;
}

function formatSkillsText(skillsObj) {
  const parts = [];
  for (const [k, lv] of Object.entries(skillsObj)) {
    if (lv > 0) {
      parts.push(`${SKILL_NAMES[k] || k}Lv${lv}`);
    }
  }
  return parts.join(' ');
}

function getEquipSummaryText() {
  let equippedCount = 0;
  let hunterCount = 0;
  let rathalosCount = 0;
  let kirinCount = 0;
  let mizutsuneCount = 0;
  for (const slot of ARMOR_SLOTS) {
    const item = ARMOR_DB[slot.key][player.equipment[slot.key]];
    if (item.series !== 'none') equippedCount++;
    if (item.series === 'hunter') hunterCount++;
    if (item.series === 'rathalos') rathalosCount++;
    if (item.series === 'kirin') kirinCount++;
    if (item.series === 'mizutsune') mizutsuneCount++;
  }
  const def = getTotalDefense();
  const fireRes = getTotalFireRes();
  const waterRes = getTotalWaterRes();
  const thunderRes = getTotalThunderRes();
  const resParts = [];
  if (fireRes > 0) resParts.push(`火${fireRes}`);
  if (waterRes > 0) resParts.push(`水${waterRes}`);
  if (thunderRes > 0) resParts.push(`雷${thunderRes}`);
  const resText = resParts.length > 0 ? `/${resParts.join('・')}` : '';

  if (equippedCount === 0) return 'なし (防御0)';
  if (hunterCount === 5) return `ハンター一式 (防御${def})`;
  if (rathalosCount === 5) return `レウス一式 (防御${def}${resText})`;
  if (kirinCount === 5) return `キリン一式 (防御${def}${resText})`;
  if (mizutsuneCount === 5) return `ミツネ一式 (防御${def}${resText})`;
  return `防具×${equippedCount}部位 (防御${def}${resText})`;
}

// クエスト選択カードの座標レイアウト計算（2列×3行）
function getQuestCardRect(slotIdxOnPage) {
  const cols = 2;
  const cardW = 395;
  const cardH = 92;
  const gapX = 26;
  const gapY = 16;
  const startX = (canvas.width - (cardW * cols + gapX)) / 2;
  const startY = 112;
  const col = slotIdxOnPage % cols;
  const row = Math.floor(slotIdxOnPage / cols);
  return {
    x: startX + col * (cardW + gapX),
    y: startY + row * (cardH + gapY),
    w: cardW,
    h: cardH
  };
}

// ページ切替ボタン座標（0: ◀ 前へ, 1: 次へ ▶）
function getPageBtnRects() {
  return [
    { x: 650, y: 72, w: 86, h: 28 },
    { x: 782, y: 72, w: 86, h: 28 }
  ];
}

function updateHoveredQuest() {
  if (gameState !== 'questSelect' || isWeaknessGuideOpen || isEquipMenuOpen) {
    hoveredQuestIndex = -1;
    hoveredPageBtn = -1;
    canvas.style.cursor = 'default';
    return;
  }

  let foundBtn = -1;
  const btnRects = getPageBtnRects();
  for (let b = 0; b < btnRects.length; b++) {
    const br = btnRects[b];
    if (mouseX >= br.x && mouseX <= br.x + br.w && mouseY >= br.y && mouseY <= br.y + br.h) {
      foundBtn = b;
      break;
    }
  }
  hoveredPageBtn = foundBtn;

  let foundCard = -1;
  const pageStart = questPage * QUESTS_PER_PAGE;
  const pageEnd = Math.min(QUEST_LIST.length, pageStart + QUESTS_PER_PAGE);
  for (let i = pageStart; i < pageEnd; i++) {
    const slotIdx = i - pageStart;
    const r = getQuestCardRect(slotIdx);
    if (mouseX >= r.x && mouseX <= r.x + r.w && mouseY >= r.y && mouseY <= r.y + r.h) {
      foundCard = i;
      break;
    }
  }
  hoveredQuestIndex = foundCard;
  canvas.style.cursor = (foundCard >= 0 || foundBtn >= 0) ? 'pointer' : 'default';
}

function startQuest(monsterKey) {
  targetMonster = monsterKey;
  canvas.style.cursor = 'default';
  resetGame();
}

function openQuestSelect() {
  isEquipMenuOpen = false;
  gameState = 'questSelect';
  updateHoveredQuest();
}

// アクション入力
function handleActionInput(code) {
  if (code === 'F2') {
    isWeaknessGuideOpen = !isWeaknessGuideOpen;
    if (isWeaknessGuideOpen) {
      isEquipMenuOpen = false;
      const singleMonsters = QUEST_LIST.filter(q => !q.isMultiTarget);
      const activeIdx = singleMonsters.findIndex(q => activeMonsters.some(m => m.hp > 0 && m.species === q.key));
      if (gameState === 'playing' && activeIdx >= 0) {
        weaknessPage = Math.floor(activeIdx / WEAKNESS_PER_PAGE);
      } else {
        const totalWP = Math.max(1, Math.ceil(singleMonsters.length / WEAKNESS_PER_PAGE));
        if (weaknessPage >= totalWP) weaknessPage = 0;
      }
    }
    updateHoveredQuest();
    return;
  }

  if (isWeaknessGuideOpen) {
    const singleMonsters = QUEST_LIST.filter(q => !q.isMultiTarget);
    const totalWeaknessPages = Math.max(1, Math.ceil(singleMonsters.length / WEAKNESS_PER_PAGE));
    if (code === 'Escape') {
      isWeaknessGuideOpen = false;
      updateHoveredQuest();
    } else if (code === 'ArrowRight' || code === 'KeyD' || code === 'KeyE' || code === 'PageDown') {
      weaknessPage = (weaknessPage + 1) % totalWeaknessPages;
    } else if (code === 'ArrowLeft' || code === 'KeyA' || code === 'KeyQ' || code === 'PageUp') {
      weaknessPage = (weaknessPage + totalWeaknessPages - 1) % totalWeaknessPages;
    }
    return;
  }

  if (code === 'ControlLeft' || code === 'ControlRight') {
    if (gameState === 'playing' || gameState === 'questSelect') {
      isEquipMenuOpen = !isEquipMenuOpen;
      updateHoveredQuest();
    }
    return;
  }

  if (isEquipMenuOpen) {
    if (code === 'Escape') {
      isEquipMenuOpen = false;
      updateHoveredQuest();
      return;
    }
    if (code === 'ArrowUp' || code === 'KeyW') {
      equipCursor = (equipCursor + EQUIP_SLOTS.length - 1) % EQUIP_SLOTS.length;
    } else if (code === 'ArrowDown' || code === 'KeyS') {
      equipCursor = (equipCursor + 1) % EQUIP_SLOTS.length;
    } else if (code === 'Enter') {
      const slotKey = EQUIP_SLOTS[equipCursor].key;
      if (slotKey === 'weapon') {
        const typeOrder = WEAPON_TYPES.map(t => t.key);
        const nextIdx = (typeOrder.indexOf(player.weaponType) + 1) % typeOrder.length;
        player.weaponType = typeOrder[nextIdx];
        player.state = 'idle';
        player.attackHitbox = null;
        player.chargeFrames = 0;
        player.chargeLevel = 0;
        player.demonMode = false;
        if (typeof EXTRA_HOOKS.onSwitchWeapon === 'function') {
          EXTRA_HOOKS.onSwitchWeapon(getHookContext());
        }
        updateControlsInfo();
      }
    } else if (code === 'ArrowLeft' || code === 'KeyA') {
      const slotKey = EQUIP_SLOTS[equipCursor].key;
      if (slotKey === 'weapon') {
        const list = WEAPON_DB[player.weaponType] || WEAPON_DB.longsword;
        player.weaponIndices[player.weaponType] = ((player.weaponIndices[player.weaponType] || 0) + list.length - 1) % list.length;
      } else {
        const listLen = ARMOR_DB[slotKey].length;
        player.equipment[slotKey] = (player.equipment[slotKey] + listLen - 1) % listLen;
      }
    } else if (code === 'ArrowRight' || code === 'KeyD' || code === 'Space' || code === 'KeyJ' || code === 'KeyZ') {
      const slotKey = EQUIP_SLOTS[equipCursor].key;
      if (slotKey === 'weapon') {
        const list = WEAPON_DB[player.weaponType] || WEAPON_DB.longsword;
        player.weaponIndices[player.weaponType] = ((player.weaponIndices[player.weaponType] || 0) + 1) % list.length;
      } else {
        const listLen = ARMOR_DB[slotKey].length;
        player.equipment[slotKey] = (player.equipment[slotKey] + 1) % listLen;
      }
    }
    return;
  }

  if (gameState === 'questSelect') {
    const totalPages = Math.ceil(QUEST_LIST.length / QUESTS_PER_PAGE);
    if (code === 'KeyQ' || code === 'PageUp') {
      questPage = (questPage + totalPages - 1) % totalPages;
      hoveredQuestIndex = questPage * QUESTS_PER_PAGE;
      return;
    } else if (code === 'KeyE' || code === 'PageDown') {
      questPage = (questPage + 1) % totalPages;
      hoveredQuestIndex = questPage * QUESTS_PER_PAGE;
      return;
    }

    const pageStart = questPage * QUESTS_PER_PAGE;
    const pageEnd = Math.min(QUEST_LIST.length, pageStart + QUESTS_PER_PAGE);
    if (code === 'ArrowRight' || code === 'KeyD') {
      if (hoveredQuestIndex < pageStart || hoveredQuestIndex >= pageEnd) {
        hoveredQuestIndex = pageStart;
      } else if (hoveredQuestIndex + 1 < pageEnd) {
        hoveredQuestIndex++;
      } else {
        questPage = (questPage + 1) % totalPages;
        hoveredQuestIndex = questPage * QUESTS_PER_PAGE;
      }
    } else if (code === 'ArrowLeft' || code === 'KeyA') {
      if (hoveredQuestIndex < pageStart || hoveredQuestIndex >= pageEnd) {
        hoveredQuestIndex = pageStart;
      } else if (hoveredQuestIndex - 1 >= pageStart) {
        hoveredQuestIndex--;
      } else {
        questPage = (questPage + totalPages - 1) % totalPages;
        hoveredQuestIndex = Math.min(QUEST_LIST.length - 1, questPage * QUESTS_PER_PAGE + QUESTS_PER_PAGE - 1);
      }
    } else if (code === 'ArrowDown' || code === 'KeyS') {
      if (hoveredQuestIndex < pageStart || hoveredQuestIndex >= pageEnd) {
        hoveredQuestIndex = pageStart;
      } else if (hoveredQuestIndex + 2 < pageEnd) {
        hoveredQuestIndex += 2;
      }
    } else if (code === 'ArrowUp' || code === 'KeyW') {
      if (hoveredQuestIndex < pageStart || hoveredQuestIndex >= pageEnd) {
        hoveredQuestIndex = pageStart;
      } else if (hoveredQuestIndex - 2 >= pageStart) {
        hoveredQuestIndex -= 2;
      }
    } else if ((code === 'Enter' || code === 'Space') && hoveredQuestIndex >= 0) {
      startQuest(QUEST_LIST[hoveredQuestIndex].key);
    }
    return;
  }

  if (code === 'KeyM') {
    openQuestSelect();
    return;
  }

  if (gameState !== 'playing') {
    if (code === 'KeyR') resetGame();
    return;
  }

  if (player.paralysisTimer > 0) return;

  // 緊急回避
  if ((code === 'ShiftLeft' || code === 'ShiftRight') && ['idle', 'run', 'jump'].includes(player.state) && player.stamina >= 25) {
    player.state = 'dodge';
    player.stateTimer = 18;
    player.invulnTimer = 14;
    player.stamina -= 25;
    player.vx = player.facing * 9;
    if (player.burnTimer > 0) player.burnTimer = Math.max(0, player.burnTimer - 120);
    if (player.thunderBlightTimer > 0) player.thunderBlightTimer = Math.max(0, player.thunderBlightTimer - 120);
  }

  // 回復薬（Hキー）
  if (code === 'KeyH' && player.potions > 0 && player.hp < player.maxHp && ['idle', 'run'].includes(player.state)) {
    player.potions--;
    const skills = getActiveSkills();
    const recLv = Math.min(3, skills.recoveryUp || 0);
    const healAmounts = [45, 52, 60, 70];
    const heal = healAmounts[recLv];
    player.hp = Math.min(player.maxHp, player.hp + heal);
    addText(`+${heal} 回復!`, player.x, player.y - 70, '#4eff4e', 18);
    addParticles(player.x + 15, player.y - 30, '#4eff4e', 12, 3);
  }

  // 回復薬グレート（Bキー・回復薬の1.5倍回復）
  if (code === 'KeyB' && player.megaPotions > 0 && player.hp < player.maxHp && ['idle', 'run'].includes(player.state)) {
    player.megaPotions--;
    const skills = getActiveSkills();
    const recLv = Math.min(3, skills.recoveryUp || 0);
    const megaHealAmounts = [68, 78, 90, 100];
    const heal = megaHealAmounts[recLv];
    player.hp = Math.min(player.maxHp, player.hp + heal);
    addText(`+${heal} 大回復!`, player.x - 6, player.y - 72, '#00e676', 20);
    addParticles(player.x + 15, player.y - 30, '#00e676', 18, 4);
  }

  // 解毒薬（Gキー）
  if (code === 'KeyG' && player.antidotes > 0 && player.poisonTimer > 0 && ['idle', 'run'].includes(player.state)) {
    player.antidotes--;
    player.poisonTimer = 0;
    addText('毒解除！', player.x, player.y - 70, '#55aaff', 18);
    addParticles(player.x + 15, player.y - 30, '#55aaff', 12, 3);
  }

  // 新武器種のアクション入力フック
  const isCustomWeapon = (EXTRA.weaponTypes || []).some(t => t.key === player.weaponType);
  if (isCustomWeapon) {
    if (typeof EXTRA_HOOKS.onPlayerAction === 'function') {
      EXTRA_HOOKS.onPlayerAction(code, getHookContext());
    }
    return;
  }

  const isGS = player.weaponType === 'greatsword';
  const isDB = player.weaponType === 'dualblades';

  if (isGS) {
    if ((code === 'KeyJ' || code === 'KeyZ') && ['idle', 'run', 'jump'].includes(player.state)) {
      player.state = 'attack';
      player.stateTimer = 26;
      resetMonsterSwingHitFlags();
    }

    if ((code === 'KeyK' || code === 'KeyX') && ['idle', 'run', 'attack'].includes(player.state)) {
      player.state = 'gsCharge';
      player.chargeFrames = 0;
      player.chargeLevel = 0;
      player.attackHitbox = null;
    }

    if ((code === 'KeyL' || code === 'KeyC') && ['idle', 'run', 'attack', 'gsCharge'].includes(player.state) && player.stamina >= 20) {
      player.state = 'gsTackle';
      player.stateTimer = 18;
      player.stamina -= 20;
      resetMonsterSwingHitFlags();
      player.vx = player.facing * 8.5;
    }
  } else if (isDB) {
    // 双剣：J/Z 二段乱舞（2〜3回ランダムヒット）
    if ((code === 'KeyJ' || code === 'KeyZ') && ['idle', 'run', 'jump'].includes(player.state)) {
      player.state = 'dbSlash';
      player.stateTimer = 16;
      resetMonsterSwingHitFlags();
      player.vx = player.facing * (player.demonMode ? 4.5 : 2.5);
    }

    // 双剣：K/X 鬼人化ON/OFF切替
    if ((code === 'KeyK' || code === 'KeyX') && ['idle', 'run', 'jump', 'dbSlash'].includes(player.state)) {
      if (!player.demonMode && player.stamina >= 15) {
        player.demonMode = true;
        addText('鬼人化！！', player.x - 10, player.y - 78, '#ff5252', 19);
        addParticles(player.x + 15, player.y - 35, '#ff1744', 18, 5);
      } else if (player.demonMode) {
        player.demonMode = false;
        addText('鬼人化解除', player.x - 10, player.y - 75, '#cfd8dc', 16);
      }
    }

    // 双剣：L/C 鬼人突進連斬（2〜3回ランダムヒット）
    if ((code === 'KeyL' || code === 'KeyC') && ['idle', 'run', 'jump', 'dbSlash'].includes(player.state) && player.stamina >= 20) {
      player.state = 'dbSpinDash';
      player.stateTimer = 20;
      player.stamina -= 20;
      resetMonsterSwingHitFlags();
      player.vx = player.facing * (player.demonMode ? 11.5 : 9.2);
    }
  } else {
    if ((code === 'KeyJ' || code === 'KeyZ') && ['idle', 'run', 'jump'].includes(player.state)) {
      player.state = 'attack';
      player.stateTimer = 18;
      resetMonsterSwingHitFlags();
    }

    if ((code === 'KeyK' || code === 'KeyX') && ['idle', 'run', 'attack'].includes(player.state) && player.spirit >= 30) {
      player.state = 'spiritAttack';
      player.stateTimer = 24;
      player.spirit -= 30;
      resetMonsterSwingHitFlags();
    }

    if ((code === 'KeyL' || code === 'KeyC') && ['idle', 'run', 'attack'].includes(player.state) && player.spirit >= 10) {
      player.state = 'foresight';
      player.stateTimer = 26;
      player.spirit = 0;
      player.foresightSuccess = false;
      resetMonsterSwingHitFlags();
      player.vx = -player.facing * 6;
    }
  }
}

function resetMonsterSwingHitFlags() {
  player.hasHitThisSwing = false;
  activeMonsters.forEach(m => {
    m.hasHitThisSwingByPlayer = false;
  });
}

function computeWeaponHitDamage(baseMotionValue, weapon, auraMult = 1.0, monsterSpecies = targetMonster) {
  const basePlusAtkSkill = weapon.attack + getAttackSkillBonus();
  const bubblyMult = player.bubblyBuffTimer > 0 ? 1.05 : 1.0;

  if (!weapon.element || weapon.element === 'none') {
    const rawTotal = baseMotionValue * (basePlusAtkSkill / 80) * auraMult * bubblyMult;
    return { dmg: Math.max(1, Math.round(rawTotal)), elemMult: 1.0 };
  }

  const elemMult = getElementMultiplier(monsterSpecies, weapon.element);
  const elemBonus = getElementSkillBonus(weapon.element);
  const combinedAtk = basePlusAtkSkill + elemBonus;

  if (elemMult === 0) {
    const physOnly = baseMotionValue * (basePlusAtkSkill / 80) * auraMult * bubblyMult * 0.75;
    return { dmg: Math.max(1, Math.round(physOnly)), elemMult };
  }

  if (elemMult >= 1.25) {
    const scaled = baseMotionValue * (combinedAtk / 80) * auraMult * bubblyMult * elemMult;
    return { dmg: Math.max(1, Math.round(scaled)), elemMult };
  }

  const rawCombined = baseMotionValue * (combinedAtk / 80) * auraMult * bubblyMult;
  const physPart = rawCombined * 0.75;
  const elemPart = rawCombined * 0.25 * elemMult;
  return { dmg: Math.max(1, Math.round(physPart + elemPart)), elemMult };
}

function updatePlayer() {
  const isCustomWeapon = (EXTRA.weaponTypes || []).some(t => t.key === player.weaponType);
  if (isCustomWeapon && typeof EXTRA_HOOKS.onUpdatePlayer === 'function') {
    const handled = EXTRA_HOOKS.onUpdatePlayer(getHookContext());
    if (handled) return;
  }

  const isGS = player.weaponType === 'greatsword';
  const isDB = player.weaponType === 'dualblades';

  if (!isDB) {
    player.demonMode = false;
  }

  // 双剣の鬼人化中はスタミナを徐々に消費（スタミナ切れで自動解除）
  if (player.demonMode) {
    player.stamina = Math.max(0, player.stamina - 0.28);
    if (Math.random() < 0.35) {
      addParticles(player.x + 15, player.y - 30, '#ff1744', 1, 2.2);
    }
    if (player.stamina <= 0) {
      player.demonMode = false;
      addText('スタミナ切れ・鬼人解除', player.x - 20, player.y - 75, '#ff8a80', 16);
    }
  } else if (player.state !== 'dodge' && player.state !== 'gsTackle' && player.state !== 'dbSpinDash') {
    player.stamina = Math.min(player.maxStamina, player.stamina + 0.35);
  }

  if (player.spiritLevel > 0) {
    player.spiritTimer--;
    if (player.spiritTimer <= 0) {
      player.spiritLevel--;
      player.spiritTimer = player.spiritLevel > 0 ? 900 : 0;
    }
  }

  if (player.bubblyBuffTimer > 0) {
    player.bubblyBuffTimer--;
    if (player.bubblyBuffTimer % 20 === 0) {
      addParticles(player.x + 15, player.y - 40, '#80deea', 1, 2);
    }
  }

  if (player.burnTimer > 0) {
    player.burnTimer--;
    if (player.burnTimer % 30 === 0) {
      player.hp = Math.max(1, player.hp - 2);
      addParticles(player.x + 15, player.y - 30, '#ff4500', 3, 2);
    }
  }

  if (player.thunderBlightTimer > 0) {
    player.thunderBlightTimer--;
    if (player.thunderBlightTimer % 18 === 0) {
      addParticles(player.x + 15, player.y - 35, '#00e5ff', 2, 2.5);
    }
  }

  if (player.bubbleTimer > 0) {
    player.bubbleTimer--;
    if (player.bubbleTimer % 16 === 0) {
      addParticles(player.x + 15, player.y - 25, '#f8bbd0', 2, 2);
    }
  }

  if (player.poisonTimer > 0) {
    player.poisonTimer--;
    if (player.poisonTimer % 35 === 0) {
      player.hp = Math.max(1, player.hp - 2);
      addParticles(player.x + 15, player.y - 35, '#b829ff', 4, 2);
    }
  }

  if (player.invulnTimer > 0) player.invulnTimer--;

  const isBubbled = player.bubbleTimer > 0;

  if (player.paralysisTimer > 0) {
    player.paralysisTimer--;
    player.vx *= 0.7;
    player.attackHitbox = null;
    if (player.state !== 'hurt') {
      player.state = 'idle';
    }
    if (player.paralysisTimer % 12 === 0) {
      addParticles(player.x + 15, player.y - 30, '#ffee00', 3, 3);
    }
  } else if (player.state === 'idle' || player.state === 'run' || player.state === 'jump') {
    let move = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) move -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) move += 1;

    const maxSpeed = isGS ? 4.1 : (isDB ? (player.demonMode ? 6.2 : 5.2) : 4.5);
    if (move !== 0) {
      player.facing = move;
      if (isBubbled) {
        player.vx += move * 0.42;
        const maxSlipSpeed = maxSpeed * 1.28;
        player.vx = Math.max(-maxSlipSpeed, Math.min(maxSlipSpeed, player.vx));
      } else {
        player.vx = move * maxSpeed;
      }
      if (player.y >= GROUND_Y) player.state = 'run';
    } else {
      player.vx *= isBubbled ? 0.955 : 0.7;
      if (Math.abs(player.vx) < 0.08) player.vx = 0;
      if (player.y >= GROUND_Y) player.state = 'idle';
    }

    if ((keys['KeyW'] || keys['Space'] || keys['ArrowUp']) && player.y >= GROUND_Y) {
      player.vy = -12.5;
      player.state = 'jump';
    }
  } else if (player.state === 'dbSlash') {
    player.vx *= 0.84;
    player.stateTimer--;
    if (player.stateTimer >= 4 && player.stateTimer <= 13) {
      player.attackHitbox = {
        x: player.facing === 1 ? player.x + 16 : player.x - 76,
        y: player.y - 68,
        w: 76,
        h: 68
      };
    } else {
      player.attackHitbox = null;
    }
    if (player.stateTimer <= 0) {
      player.state = 'idle';
      player.attackHitbox = null;
    }
  } else if (player.state === 'dbSpinDash') {
    player.vx *= 0.9;
    player.stateTimer--;
    if (player.stateTimer >= 4 && player.stateTimer <= 17) {
      player.attackHitbox = {
        x: player.facing === 1 ? player.x + 8 : player.x - 66,
        y: player.y - 66,
        w: 88,
        h: 66
      };
    } else {
      player.attackHitbox = null;
    }
    if (player.stateTimer <= 0) {
      player.state = 'idle';
      player.attackHitbox = null;
    }
  } else if (player.state === 'attack') {
    player.vx *= isBubbled ? 0.94 : 0.8;
    player.stateTimer--;
    if (isGS) {
      if (player.stateTimer >= 8 && player.stateTimer <= 17) {
        player.attackHitbox = {
          x: player.facing === 1 ? player.x + 18 : player.x - 110,
          y: player.y - 88,
          w: 110,
          h: 88
        };
      } else {
        player.attackHitbox = null;
      }
    } else {
      if (player.stateTimer >= 6 && player.stateTimer <= 13) {
        player.attackHitbox = {
          x: player.facing === 1 ? player.x + 20 : player.x - 95,
          y: player.y - 75,
          w: 95,
          h: 75
        };
      } else {
        player.attackHitbox = null;
      }
    }
    if (player.stateTimer <= 0) {
      player.state = 'idle';
      player.attackHitbox = null;
    }
  } else if (player.state === 'gsCharge') {
    player.vx *= isBubbled ? 0.93 : 0.7;
    player.chargeFrames++;
    const maxChargeF = getMaxChargeFrames();
    const lv1F = Math.round(maxChargeF * 0.29);
    const lv2F = Math.round(maxChargeF * 0.63);
    const lv3F = maxChargeF;

    if (player.chargeFrames === lv1F) {
      player.chargeLevel = 1;
      addParticles(player.x + 15, player.y - 45, '#ffffff', 10, 4);
    } else if (player.chargeFrames === lv2F) {
      player.chargeLevel = 2;
      addParticles(player.x + 15, player.y - 45, '#ffd700', 14, 5);
    } else if (player.chargeFrames === lv3F) {
      player.chargeLevel = 3;
      addText('最大溜め！', player.x - 10, player.y - 82, '#ff5252', 18);
      addParticles(player.x + 15, player.y - 45, '#ff3333', 18, 6);
    }

    const isHoldingCharge = keys['KeyK'] || keys['KeyX'];
    if (!isHoldingCharge || player.chargeFrames >= lv3F + 28) {
      player.state = 'gsChargeSlash';
      player.stateTimer = 24;
      resetMonsterSwingHitFlags();
      player.vx = player.facing * (3 + player.chargeLevel * 1.2);
    }
  } else if (player.state === 'gsChargeSlash') {
    player.vx *= isBubbled ? 0.92 : 0.82;
    player.stateTimer--;
    if (player.stateTimer >= 9 && player.stateTimer <= 19) {
      player.attackHitbox = {
        x: player.facing === 1 ? player.x + 15 : player.x - 125,
        y: player.y - 95,
        w: 125,
        h: 95
      };
    } else {
      player.attackHitbox = null;
    }
    if (player.stateTimer <= 0) {
      player.state = 'idle';
      player.attackHitbox = null;
      player.chargeLevel = 0;
    }
  } else if (player.state === 'gsTackle') {
    player.vx *= 0.88;
    player.stateTimer--;
    if (player.stateTimer >= 6 && player.stateTimer <= 16) {
      player.attackHitbox = {
        x: player.facing === 1 ? player.x + 10 : player.x - 35,
        y: player.y - 60,
        w: 55,
        h: 60
      };
    } else {
      player.attackHitbox = null;
    }
    if (player.stateTimer <= 0) {
      player.state = 'idle';
      player.attackHitbox = null;
    }
  } else if (player.state === 'spiritAttack') {
    player.vx = player.facing * 2.5;
    player.stateTimer--;
    if (player.stateTimer >= 6 && player.stateTimer <= 16) {
      player.attackHitbox = {
        x: player.facing === 1 ? player.x + 15 : player.x - 115,
        y: player.y - 80,
        w: 115,
        h: 80
      };
    } else {
      player.attackHitbox = null;
    }
    if (player.stateTimer <= 0) {
      player.state = 'idle';
      player.attackHitbox = null;
    }
  } else if (player.state === 'foresight') {
    player.stateTimer--;
    if (player.stateTimer === 12) {
      player.vx = player.facing * 10;
    } else {
      player.vx *= 0.85;
    }
    if (player.stateTimer >= 4 && player.stateTimer <= 12) {
      player.attackHitbox = {
        x: player.facing === 1 ? player.x + 15 : player.x - 105,
        y: player.y - 80,
        w: 105,
        h: 80
      };
    } else {
      player.attackHitbox = null;
    }
    if (player.stateTimer <= 0) {
      player.state = 'idle';
      player.attackHitbox = null;
    }
  } else if (player.state === 'dodge' || player.state === 'hurt') {
    player.vx *= isBubbled ? 0.94 : 0.9;
    player.stateTimer--;
    if (player.stateTimer <= 0) player.state = 'idle';
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  if (player.y >= GROUND_Y) {
    player.y = GROUND_Y;
    player.vy = 0;
  }
  player.x = Math.max(20, Math.min(canvas.width - 50, player.x));

  if (player.attackHitbox) {
    const weapon = getCurrentWeapon();
    const isThunderWeapon = weapon.element === 'thunder';
    const isFireWeapon = weapon.element === 'fire';
    const isWaterWeapon = weapon.element === 'water';
    const isIceWeapon = weapon.element === 'ice';
    const isDragonWeapon = weapon.element === 'dragon';

    const hitSparkColor = isThunderWeapon ? '#00e5ff'
      : (isFireWeapon ? '#ff6d00'
        : (isWaterWeapon ? '#4fc3f7'
          : (isIceWeapon ? '#80deea'
            : (isDragonWeapon ? '#d500f9' : '#fff'))));

    for (const m of activeMonsters) {
      if (m.hp <= 0 || m.hasHitThisSwingByPlayer) continue;
      if (!rectIntersect(player.attackHitbox, getMonsterBody(m))) continue;

      m.hasHitThisSwingByPlayer = true;
      m.flashTimer = 6;

      let result = { dmg: 0, elemMult: 1.0 };
      let hitCount = 1;
      let hitDamages = [];

      if (isDB) {
        // 双剣：1回の攻撃でランダム2〜3回ダメージを与える！
        hitCount = Math.random() < 0.5 ? 2 : 3;
        const demonMult = player.demonMode ? 1.2 : 1.0;
        const perHitMV = player.state === 'dbSpinDash' ? 14 : 11;
        for (let h = 0; h < hitCount; h++) {
          const rHit = computeWeaponHitDamage(perHitMV, weapon, demonMult, m.species);
          hitDamages.push(rHit.dmg);
          result.elemMult = rHit.elemMult;
        }
        result.dmg = hitDamages.reduce((a, b) => a + b, 0);
        screenShake = Math.max(screenShake, player.state === 'dbSpinDash' ? 5 : 3);
        addParticles(m.x + 40, m.y - 45, hitSparkColor, 10 + hitCount * 4, 6);
      } else if (isGS) {
        if (player.state === 'attack') {
          result = computeWeaponHitDamage(31, weapon, 1.0, m.species);
          addParticles(m.x + 40, m.y - 45, hitSparkColor, 12, 6);
        } else if (player.state === 'gsChargeSlash') {
          const chargeBase = [34, 50, 68, 92][player.chargeLevel];
          result = computeWeaponHitDamage(chargeBase, weapon, 1.0, m.species);
          screenShake = 5 + player.chargeLevel * 3;
          addParticles(m.x + 40, m.y - 45, hitSparkColor === '#fff' ? '#ffd700' : hitSparkColor, 14 + player.chargeLevel * 5, 8);
        } else if (player.state === 'gsTackle') {
          const baseAtk = getCurrentWeapon().attack + getAttackSkillBonus();
          result = { dmg: Math.round(18 * (baseAtk / 80)), elemMult: 1.0 };
          screenShake = 4;
          addParticles(m.x + 40, m.y - 45, '#ffffff', 10, 5);
        }
        hitDamages = [result.dmg];
      } else {
        const auraMult = [1.0, 1.1, 1.2, 1.35][player.spiritLevel];

        if (player.state === 'attack') {
          result = computeWeaponHitDamage(28, weapon, auraMult, m.species);
          if (!player.hasHitThisSwing) {
            player.spirit = Math.min(player.maxSpirit, player.spirit + 22);
          }
          addParticles(m.x + 40, m.y - 45, hitSparkColor, weapon.element !== 'none' ? 12 : 8, 5);
        } else if (player.state === 'spiritAttack') {
          result = computeWeaponHitDamage(52, weapon, auraMult, m.species);
          if (!player.hasHitThisSwing) {
            if (player.spiritLevel < 3) {
              player.spiritLevel++;
              player.spiritTimer = 1200;
              const names = ['', '練気【白】', '練気【黄】', '練気【赤】'];
              const colors = ['', '#ffffff', '#ffd700', '#ff3333'];
              addText(names[player.spiritLevel], player.x, player.y - 85, colors[player.spiritLevel], 20);
            } else {
              player.spiritTimer = 1200;
            }
          }
          screenShake = 5;
          addParticles(m.x + 40, m.y - 45, weapon.element !== 'none' ? hitSparkColor : '#ff4444', 16, 7);
        } else if (player.state === 'foresight') {
          result = computeWeaponHitDamage(player.foresightSuccess ? 65 : 25, weapon, auraMult, m.species);
          if (player.foresightSuccess && !player.hasHitThisSwing) {
            player.spirit = 100;
            if (player.spiritLevel < 3) player.spiritLevel++;
            player.spiritTimer = 1200;
            addText('見切り成功！練気解放！', player.x - 30, player.y - 90, '#00ffff', 22);
            screenShake = 8;
          }
          addParticles(m.x + 40, m.y - 45, '#00ffff', 16, 7);
        }
        hitDamages = [result.dmg];
      }

      player.hasHitThisSwing = true;

      const dmg = result.dmg;
      m.hp -= dmg;

      let dmgTextColor = isThunderWeapon ? '#80ffff'
        : (isFireWeapon ? '#ffab40'
          : (isWaterWeapon ? '#4fc3f7'
            : (isIceWeapon ? '#b2ebf2'
              : (isDragonWeapon ? '#ea80fc' : '#ffd700'))));
      if (weapon.element !== 'none' && !(isGS && player.state === 'gsTackle')) {
        if (result.elemMult === 0) {
          dmgTextColor = '#b0bec5';
        } else if (result.elemMult >= 1.25) {
          dmgTextColor = isDragonWeapon ? '#e040fb'
            : (isFireWeapon ? '#ff6d00'
              : (isWaterWeapon ? '#29b6f6'
                : (isIceWeapon ? '#4dd0e1' : '#00e5ff')));
        }
      }

      // ダメージ数値表示（双剣は2〜3回分を連撃表示！）
      if (isDB) {
        hitDamages.forEach((hd, idx) => {
          addText(hd, m.x + 28 + idx * 18, m.y - 54 - idx * 18, dmgTextColor, 20);
        });
        addText(`${hitCount}HIT!`, m.x + 36, m.y - 108, '#ffee58', 15);
      } else {
        addText(dmg, m.x + 40 + (Math.random() * 20 - 10), m.y - 60, dmgTextColor, isGS && player.state === 'gsChargeSlash' && player.chargeLevel >= 2 ? 26 : 22);
      }


      if (m.hp <= 0) {
        m.hp = 0;
        m.attackHitbox = null;
        addText('部位破壊・討伐！', m.x + 10, m.y - 95, '#ffd700', 22);
        addParticles(m.x + m.w / 2, m.y - 45, '#ffd700', 24, 7);
        continue;
      }

      if (m.species === 'gore' && m.isFrenzied) {
        m.frenzyDamageTaken += dmg;
        const threshold = Math.ceil(m.maxHp / 16);
        if (m.frenzyDamageTaken >= threshold) {
          m.isFrenzied = false;
          m.frenzyDamageTaken = 0;
          m.frenzyCooldown = 900;
          m.state = 'stagger';
          m.stateTimer = 70;
          m.attackHitbox = null;
          screenShake = 12;
          addText('狂竜化解除！！（15秒間抑制）', m.x - 30, m.y - 115, '#e040fb', 23);
          addParticles(m.x + m.w / 2, m.y - 50, '#ea80fc', 28, 8);
          continue;
        }
      }

      const staggerChance = isGS ? (player.state === 'gsChargeSlash' ? 0.16 + player.chargeLevel * 0.05 : 0.18) : (isDB ? 0.09 : 0.12);
      if (Math.random() < staggerChance && m.state !== 'stagger') {
        m.state = 'stagger';
        m.stateTimer = 50;
        m.isFlying = false;
        m.isCharged = false;
        m.somersaultAngle = 0;
        m.attackHitbox = null;
        m.isPoisonAttack = false;
        m.isElectricAttack = false;
        m.isBubbleAttack = false;
        addText('怯み！', m.x + 30, m.y - 100, '#ffaa00', 24);
      }
    }
  }
}

function getMonsterBody(m) {
  return { x: m.x, y: m.y - m.h, w: m.w, h: m.h };
}

function updateSingleMonster(m) {
  // 一対の巨影：リオレイアのHPが2000以下になったらリオレウス登場！（全武器種共通）
  if (targetMonster === 'raths_duo' && m.species === 'rathian' && !duoRathalosSpawned && m.hp <= 2000) {
    duoRathalosSpawned = true;
    const rath = createMonsterEntity('rathalos', player.x < 450 ? 740 : 120);
    rath.isFlying = true;
    rath.y = GROUND_Y - 125;
    rath.state = 'roar';
    rath.stateTimer = 45;
    activeMonsters.push(rath);
    screenShake = 12;
    addText('火竜 リオレウス 乱入！！', canvas.width / 2 - 120, 145, '#ff5252', 26);
    addParticles(rath.x + rath.w / 2, rath.y - 50, '#ff6d00', 26, 8);
  }
  if (m.hp <= 0) return;
  if (m.hp <= 0) return;
  if (m.flashTimer > 0) m.flashTimer--;

  // 外部箱のカスタムAI更新フック
  if (typeof EXTRA_HOOKS.onUpdateMonster === 'function') {
    const handled = EXTRA_HOOKS.onUpdateMonster(m, getHookContext());
    if (handled) return;
  }

  const sp = m.species;

  if (sp === 'zinogre' || sp === 'kirin' || sp === 'gore' || sp === 'tobi' || sp === 'mizutsune') {
    m.isFlying = false;
  }

  if (m.state !== 'poisonTail') {
    const desiredY = m.isFlying ? GROUND_Y - 125 : GROUND_Y;
    m.y += (desiredY - m.y) * 0.09;
    m.somersaultAngle = 0;
  }

  if (sp === 'zinogre' && m.isCharged && Math.random() < 0.35) {
    addParticles(m.x + Math.random() * m.w, m.y - Math.random() * m.h, '#00e5ff', 1, 2);
  }
  if (sp === 'tobi' && Math.random() < 0.32) {
    addParticles(m.x + Math.random() * m.w, m.y - Math.random() * m.h, '#ffee58', 1, 2);
  }
  if (sp === 'kirin' && Math.random() < 0.3) {
    addParticles(m.x + Math.random() * m.w, m.y - Math.random() * m.h, '#b3e5fc', 1, 2);
  }
  if (sp === 'barioth' && Math.random() < 0.25) {
    addParticles(m.x + Math.random() * m.w, m.y - Math.random() * m.h, '#b2ebf2', 1, 2);
  }
  if (sp === 'mizutsune' && Math.random() < 0.25) {
    addParticles(m.x + Math.random() * m.w, m.y - Math.random() * m.h, '#f8bbd0', 1, 2);
  }
  if (sp === 'gore') {
    if (m.frenzyCooldown > 0) {
      m.frenzyCooldown--;
    }
    if (m.isFrenzied) {
      if (Math.random() < 0.45) {
        addParticles(m.x + Math.random() * m.w, m.y - Math.random() * m.h, '#aa00ff', 1, 3);
      }
    } else if (Math.random() < 0.18) {
      addParticles(m.x + Math.random() * m.w, m.y - Math.random() * m.h, '#6a1b9a', 1, 2);
    }
  }

  m.stateTimer--;

  if (m.state === 'idle') {
    m.facing = player.x < m.x + m.w / 2 ? -1 : 1;
    m.vx *= 0.8;
    if (m.stateTimer <= 0) {
      chooseMonsterAction(m);
    }
  } else if (m.state === 'walk') {
    m.facing = player.x < m.x + m.w / 2 ? -1 : 1;
    m.vx = m.facing * (sp === 'zinogre' || sp === 'tobi' ? 3.2 : 2.2);
    if (m.stateTimer <= 0) {
      chooseMonsterAction(m);
    }
  } else if (m.state === 'roar') {
    m.vx = 0;
    if (m.stateTimer === 35) {
      screenShake = 10;
      addText('グオオォォォ！！', m.x, m.y - 110, '#ff5555', 22);
      addParticles(m.x + 50, m.y - 60, '#ffaa00', 20, 8);
    }
    if (m.stateTimer <= 0) {
      if (sp === 'rathalos') {
        m.isFlying = true;
      }
      m.state = 'idle';
      m.stateTimer = 30;
    }
  } else if (m.state === 'tobiScratch') {
    if (m.stateTimer > 20) {
      m.vx = -m.facing * 1.3;
      m.attackHitbox = null;
      if (m.stateTimer % 3 === 0) {
        const clawX = m.facing === 1 ? m.x + m.w : m.x;
        addParticles(clawX, m.y - 45, '#ffee58', 3, 3);
      }
    } else if (m.stateTimer > 7) {
      m.vx = m.facing * 9.8;
      const hitX = m.facing === 1 ? m.x + 22 : m.x - 42;
      m.attackHitbox = {
        x: hitX,
        y: m.y - m.h,
        w: m.w + 20,
        h: m.h
      };
      m.isPoisonAttack = false;
      m.isElectricAttack = true;
      m.isBubbleAttack = false;
      addParticles(hitX + (m.facing === 1 ? m.w : 0), m.y - 35, '#ffee58', 3, 4);
    } else {
      m.vx *= 0.7;
      m.attackHitbox = null;
      m.isElectricAttack = false;
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 38;
      m.attackHitbox = null;
      m.isElectricAttack = false;
    }
  } else if (m.state === 'tobiCharge') {
    if (m.stateTimer > 24) {
      m.vx = -m.facing * 1.6;
      if (m.stateTimer % 3 === 0) {
        addParticles(m.x + m.w / 2, m.y - 45, '#fff176', 3, 3);
      }
    } else {
      m.vx = m.facing * 12.2;
      m.attackHitbox = getMonsterBody(m);
      m.isPoisonAttack = false;
      m.isElectricAttack = true;
      m.isBubbleAttack = false;
      if (m.stateTimer % 2 === 0) {
        addParticles(m.x + m.w / 2, m.y - 35, '#ffee58', 2, 4);
      }
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 42;
      m.attackHitbox = null;
      m.isElectricAttack = false;
    }
  } else if (m.state === 'tobiWave') {
    m.vx = 0;
    if (m.stateTimer === 24) {
      spawnThunderWave(m);
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 40;
    }
  } else if (m.state === 'mizuSlide') {
    if (m.stateTimer > 28) {
      m.vx = -m.facing * 4.5;
      if (m.stateTimer % 3 === 0) {
        addParticles(m.x + m.w / 2, GROUND_Y - 12, '#f8bbd0', 3, 3);
      }
    } else if (m.stateTimer > 8) {
      m.vx = m.facing * 11.5;
      m.attackHitbox = getMonsterBody(m);
      m.isPoisonAttack = false;
      m.isElectricAttack = false;
      m.isBubbleAttack = true;
      if (m.stateTimer % 2 === 0) {
        addParticles(m.x + m.w / 2, GROUND_Y - 16, '#81d4fa', 2, 3);
      }
    } else {
      m.vx *= 0.82;
      m.attackHitbox = null;
      m.isBubbleAttack = false;
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 38;
      m.attackHitbox = null;
      m.isBubbleAttack = false;
    }
  } else if (m.state === 'mizuWaterBeam') {
    m.vx = 0;
    if (m.stateTimer === 24) {
      spawnWaterJet(m);
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 40;
    }
  } else if (m.state === 'mizuBubbles') {
    m.vx = 0;
    if (m.stateTimer === 24) {
      spawnBubbleOrbs(m);
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 40;
    }
  } else if (m.state === 'bariothAerialBeam') {
    m.isFlying = true;
    m.facing = player.x < m.x + m.w / 2 ? -1 : 1;
    m.vx *= 0.85;

    if (m.stateTimer === 48) {
      spawnBariothIceBeam(m);
      m.bariothBeamsFired = 1;
    }
    if (m.bariothBeamCount === 2 && m.stateTimer === 22) {
      spawnBariothIceBeam(m);
      m.bariothBeamsFired = 2;
    }

    if (m.stateTimer <= 0) {
      m.isFlying = false;
      m.state = 'idle';
      m.stateTimer = 42;
    }
  } else if (m.state === 'bariothIceSpear') {
    m.vx = 0;
    if (m.stateTimer === 38) {
      spawnBariothIceSpear(m);
      addParticles(m.x + m.w / 2, m.y - 50, '#80deea', 16, 5);
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 46;
    }
  } else if (m.state === 'goreFrenzyRoar') {
    m.vx = 0;
    if (m.stateTimer % 3 === 0) {
      addParticles(m.x + m.w / 2, m.y - 55, '#aa00ff', 7, 6);
    }
    if (m.stateTimer === 14) {
      m.isFrenzied = true;
      m.frenzyDamageTaken = 0;
      screenShake = 12;
      addText('狂竜化！！', m.x + 10, m.y - 115, '#d500f9', 24);
      addParticles(m.x + m.w / 2, m.y - 50, '#e040fb', 30, 9);
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 25;
    }
  } else if (m.state === 'goreExplodeBreath') {
    m.vx = 0;
    const triggerFrame = m.isFrenzied ? 22 : 28;
    if (m.stateTimer === triggerFrame) {
      const targetX = player.x + player.w / 2;
      spawnFrenzyBomb(targetX);
      if (m.isFrenzied) {
        spawnFrenzyBomb(targetX + m.facing * 95);
      }
      const mouthX = m.facing === 1 ? m.x + m.w : m.x;
      addParticles(mouthX, m.y - 55, '#aa00ff', 15, 5);
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = m.isFrenzied ? 30 : 42;
    }
  } else if (m.state === 'goreSpreadBreath') {
    m.vx = 0;
    const triggerFrame = m.isFrenzied ? 22 : 28;
    if (m.stateTimer === triggerFrame) {
      const targetX = player.x + player.w / 2;
      spawnFrenzySpreadCloud(targetX, m.isFrenzied);
      const mouthX = m.facing === 1 ? m.x + m.w : m.x;
      addParticles(mouthX, m.y - 52, '#d500f9', 18, 6);
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = m.isFrenzied ? 32 : 44;
    }
  } else if (m.state === 'goreSlam') {
    const windupEnd = m.isFrenzied ? 22 : 28;
    const slamEnd = 10;
    if (m.stateTimer > windupEnd) {
      m.vx = -m.facing * 1.4;
      m.attackHitbox = null;
      if (m.stateTimer % 4 === 0) {
        const wingX = m.facing === 1 ? m.x + m.w : m.x;
        addParticles(wingX, m.y - 80, '#aa00ff', 3, 3);
      }
    } else if (m.stateTimer > slamEnd) {
      m.vx = m.facing * (m.isFrenzied ? 10.5 : 8.5);
      const slamX = m.facing === 1 ? m.x + 25 : m.x - 45;
      m.attackHitbox = {
        x: slamX,
        y: m.y - m.h,
        w: m.w + 20,
        h: m.h
      };
      m.isPoisonAttack = false;
      m.isElectricAttack = false;
      m.isBubbleAttack = false;
      if (m.stateTimer === windupEnd - 2) {
        screenShake = 8;
        addParticles(slamX + (m.facing === 1 ? m.w : 0), GROUND_Y - 12, '#aa00ff', 16, 6);
      }
    } else {
      m.vx *= 0.7;
      m.attackHitbox = null;
    }

    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = m.isFrenzied ? 32 : 45;
      m.attackHitbox = null;
    }
  } else if (m.state === 'charge') {
    if (m.stateTimer > 25) {
      m.vx = -m.facing * 1.5;
    } else {
      const chargeSpeed = (sp === 'kirin' || sp === 'barioth') ? 12.5 : 11;
      m.vx = m.facing * chargeSpeed;
      m.attackHitbox = getMonsterBody(m);
      m.isPoisonAttack = false;
      m.isElectricAttack = false;
      m.isBubbleAttack = false;
      if (sp === 'barioth' && m.stateTimer % 3 === 0) {
        addParticles(m.x + m.w / 2, GROUND_Y - 12, '#b2ebf2', 2, 3);
      }
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 45;
      m.attackHitbox = null;
    }
  } else if (m.state === 'kirinAroundThunder') {
    m.vx = 0;
    if (m.stateTimer === 32) {
      const cx = m.x + m.w / 2;
      const offsets = [-170, -85, 85, 170];
      offsets.forEach(off => spawnLightningCloud(cx + off));
      addParticles(cx, m.y - m.h - 10, '#81d4fa', 16, 5);
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 45;
    }
  } else if (m.state === 'kirinTargetThunder') {
    m.vx = 0;
    if (m.stateTimer === 32) {
      const targetX = player.x + player.w / 2;
      spawnLightningCloud(targetX);
      const cx = m.x + m.w / 2;
      addParticles(cx, m.y - m.h - 10, '#4fc3f7', 16, 5);
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 45;
    }
  } else if (m.state === 'kirinGrandThunder') {
    m.vx = 0;
    if (m.stateTimer % 4 === 0) {
      addParticles(m.x + m.w / 2, m.y - m.h - 16, '#00e5ff', 5, 5);
    }
    if (m.stateTimer === 32) {
      const startOffset = 75 + Math.random() * 45;
      for (let k = 0; k < 6; k++) {
        spawnLightningCloud(startOffset + k * 145);
      }
      screenShake = 9;
      addText('大放電！！', m.x + 10, m.y - 115, '#80d8ff', 22);
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 46;
    }
  } else if (m.state === 'fireball') {
    m.vx = 0;
    if (m.stateTimer === 25) {
      const mouthX = m.facing === 1 ? m.x + m.w : m.x;
      const mouthY = m.y - 65;
      const angle = Math.atan2((player.y - 30) - mouthY, (player.x + 15) - mouthX);
      fireballs.push({
        x: mouthX, y: mouthY,
        vx: Math.cos(angle) * 7.5,
        vy: Math.sin(angle) * 7.5,
        r: 14
      });
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 40;
    }
  } else if (m.state === 'poisonShot') {
    m.vx = 0;
    if (m.stateTimer === 25) {
      const mouthX = m.facing === 1 ? m.x + m.w : m.x;
      const mouthY = m.y - 65;
      const angle = Math.atan2((player.y - 30) - mouthY, (player.x + 15) - mouthX);
      poisonClouds.push({
        x: mouthX, y: mouthY,
        vx: Math.cos(angle) * 6.8,
        vy: Math.sin(angle) * 6.8,
        r: 15
      });
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 40;
    }
  } else if (m.state === 'poisonTail') {
    if (m.stateTimer > 38) {
      m.vx = -m.facing * 1.8;
      m.somersaultAngle = 0;
      m.attackHitbox = null;
      if (m.stateTimer % 4 === 0) {
        const tailTipX = m.facing === 1 ? m.x - 30 : m.x + m.w + 30;
        addParticles(tailTipX, m.y - 40, '#b829ff', 3, 2);
      }
    } else if (m.stateTimer > 12) {
      const progress = (38 - m.stateTimer) / 26;
      m.vx = m.facing * 5.2;
      m.y = GROUND_Y - Math.sin(progress * Math.PI) * 115;
      m.somersaultAngle = -m.facing * progress * Math.PI * 2;

      const centerX = m.x + m.w / 2;
      const centerY = m.y - m.h / 2;
      const tailDist = 115;
      const tailAngle = m.somersaultAngle + (m.facing === 1 ? Math.PI : 0);
      const tailRootX = centerX + Math.cos(tailAngle) * 35;
      const tailRootY = centerY + Math.sin(tailAngle) * 35;
      const tailTipX = centerX + Math.cos(tailAngle) * tailDist;
      const tailTipY = centerY + Math.sin(tailAngle) * tailDist;

      addParticles(tailTipX, tailTipY, '#c94bff', 3, 2);

      const minX = Math.min(tailRootX, tailTipX) - 26;
      const maxX = Math.max(tailRootX, tailTipX) + 26;
      const minY = Math.min(tailRootY, tailTipY) - 26;
      const maxY = Math.max(tailRootY, tailTipY) + 26;

      m.attackHitbox = {
        x: minX,
        y: minY,
        w: maxX - minX,
        h: maxY - minY
      };
      m.isPoisonAttack = true;
      m.isElectricAttack = false;
      m.isBubbleAttack = false;
    } else {
      m.vx *= 0.7;
      m.y = GROUND_Y;
      m.somersaultAngle = 0;
      m.attackHitbox = null;
      m.isPoisonAttack = false;
    }

    if (m.stateTimer <= 0) {
      m.y = GROUND_Y;
      m.somersaultAngle = 0;
      m.state = 'idle';
      m.stateTimer = 45;
      m.attackHitbox = null;
      m.isPoisonAttack = false;
    }
  } else if (m.state === 'zinogreCharge') {
    m.vx = 0;
    if (m.stateTimer % 4 === 0) {
      addParticles(m.x + m.w / 2, m.y - 50, '#00e5ff', 6, 5);
    }
    if (m.stateTimer === 10) {
      m.isCharged = true;
      screenShake = 8;
      addText('超帯電状態！！', m.x, m.y - 110, '#00e5ff', 22);
      addParticles(m.x + m.w / 2, m.y - 50, '#80ffff', 25, 8);
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 35;
    }
  } else if (m.state === 'thunderShot') {
    m.vx = 0;
    if (m.stateTimer === 25) {
      const mouthX = m.facing === 1 ? m.x + m.w : m.x;
      const mouthY = m.y - 60;
      const angle = Math.atan2((player.y - 30) - mouthY, (player.x + 15) - mouthX);
      thunderOrbs.push({
        x: mouthX, y: mouthY,
        vx: Math.cos(angle) * 7.5,
        vy: Math.sin(angle) * 7.5,
        r: 15
      });
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 40;
    }
  } else if (m.state === 'thunderClaw') {
    if (m.stateTimer > 22) {
      m.vx = -m.facing * 1.2;
      if (m.stateTimer % 3 === 0) {
        const pawX = m.facing === 1 ? m.x + m.w : m.x;
        addParticles(pawX, m.y - 45, '#00e5ff', 4, 3);
      }
    } else if (m.stateTimer > 8) {
      m.vx = m.facing * 9.5;
      const clawX = m.facing === 1 ? m.x + 20 : m.x - 35;
      m.attackHitbox = {
        x: clawX,
        y: m.y - m.h,
        w: m.w + 15,
        h: m.h
      };
      m.isPoisonAttack = false;
      m.isElectricAttack = true;
      m.isBubbleAttack = false;
      addParticles(clawX + (m.facing === 1 ? m.w : 0), m.y - 20, '#00e5ff', 3, 4);
    } else {
      m.vx *= 0.7;
      m.attackHitbox = null;
      m.isElectricAttack = false;
    }
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 42;
      m.attackHitbox = null;
      m.isElectricAttack = false;
    }
  } else if (m.state === 'swoop') {
    if (m.stateTimer > 30) {
      m.vx = 0;
    } else {
      m.vx = m.facing * 12;
      m.y = Math.min(GROUND_Y, m.y + 7);
      m.attackHitbox = getMonsterBody(m);
      m.isPoisonAttack = false;
      m.isElectricAttack = false;
      m.isBubbleAttack = false;
    }
    if (m.stateTimer <= 0) {
      m.isFlying = false;
      m.state = 'idle';
      m.stateTimer = 50;
      m.attackHitbox = null;
    }
  } else if (m.state === 'stagger') {
    m.vx *= 0.8;
    if (m.stateTimer <= 0) {
      m.state = 'idle';
      m.stateTimer = 30;
    }
  }

  m.x += m.vx;
  m.x = Math.max(30, Math.min(canvas.width - m.w - 30, m.x));

  if (m.attackHitbox && !m.hasHitThisAttack) {
    const pBox = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };
    if (rectIntersect(m.attackHitbox, pBox)) {
      const dmg = (sp === 'gore' && m.isFrenzied) ? 32 : 26;
      damagePlayer(dmg, false, m.isPoisonAttack, m.isElectricAttack, m.isBubbleAttack);
      m.hasHitThisAttack = true;
    }
  }
}

function chooseMonsterAction(m) {
  m.facing = player.x < m.x + m.w / 2 ? -1 : 1;
  m.hasHitThisAttack = false;
  m.isPoisonAttack = false;
  m.isElectricAttack = false;
  m.isBubbleAttack = false;

  // 外部箱の行動決定フック
  if (typeof EXTRA_HOOKS.onChooseAction === 'function') {
    const handled = EXTRA_HOOKS.onChooseAction(m, getHookContext());
    if (handled) return;
  }

  const r = Math.random();
  const sp = m.species;

  if (sp === 'tobi') {
    if (r < 0.36) {
      m.state = 'tobiScratch';
      m.stateTimer = 46;
    } else if (r < 0.70) {
      m.state = 'tobiCharge';
      m.stateTimer = 50;
    } else {
      m.state = 'tobiWave';
      m.stateTimer = 44;
    }
    return;
  }

  if (sp === 'mizutsune') {
    if (r < 0.38) {
      m.state = 'mizuSlide';
      m.stateTimer = 52;
    } else if (r < 0.70) {
      m.state = 'mizuWaterBeam';
      m.stateTimer = 44;
    } else {
      m.state = 'mizuBubbles';
      m.stateTimer = 44;
    }
    return;
  }

  if (sp === 'barioth') {
    if (r < 0.34) {
      m.state = 'charge';
      m.stateTimer = 50;
    } else if (r < 0.67) {
      m.state = 'bariothAerialBeam';
      m.bariothBeamCount = Math.random() < 0.5 ? 1 : 2;
      m.bariothBeamsFired = 0;
      m.isFlying = true;
      m.stateTimer = 68;
    } else {
      m.state = 'bariothIceSpear';
      m.stateTimer = 52;
    }
    return;
  }

  if (sp === 'gore') {
    if (!m.isFrenzied && m.frenzyCooldown <= 0 && r < 0.25) {
      m.state = 'goreFrenzyRoar';
      m.stateTimer = 46;
      return;
    }
    const atkRoll = Math.random();
    if (atkRoll < 0.34) {
      m.state = 'goreExplodeBreath';
      m.stateTimer = m.isFrenzied ? 42 : 50;
    } else if (atkRoll < 0.67) {
      m.state = 'goreSpreadBreath';
      m.stateTimer = m.isFrenzied ? 42 : 50;
    } else {
      m.state = 'goreSlam';
      m.stateTimer = m.isFrenzied ? 42 : 50;
    }
    return;
  }

  if (sp === 'kirin') {
    if (r < 0.28) {
      m.state = 'charge';
      m.stateTimer = 50;
    } else if (r < 0.54) {
      m.state = 'kirinAroundThunder';
      m.stateTimer = 46;
    } else if (r < 0.78) {
      m.state = 'kirinTargetThunder';
      m.stateTimer = 46;
    } else {
      m.state = 'kirinGrandThunder';
      m.stateTimer = 50;
    }
    return;
  }

  if (sp === 'zinogre') {
    if (!m.isCharged && r < 0.25) {
      m.state = 'zinogreCharge';
      m.stateTimer = 55;
    } else if (r < 0.42) {
      m.state = 'walk';
      m.stateTimer = 35;
    } else if (r < 0.62) {
      m.state = 'charge';
      m.stateTimer = 52;
    } else if (r < 0.84) {
      m.state = 'thunderClaw';
      m.stateTimer = 48;
    } else {
      m.state = 'thunderShot';
      m.stateTimer = 45;
    }
    return;
  }

  if (sp === 'rathian') {
    if (r < 0.22) {
      m.state = 'walk';
      m.stateTimer = 40;
    } else if (r < 0.48) {
      m.state = 'charge';
      m.stateTimer = 55;
    } else if (r < 0.72) {
      m.state = 'poisonTail';
      m.stateTimer = 64;
    } else if (r < 0.88) {
      m.state = 'poisonShot';
      m.stateTimer = 45;
    } else {
      m.state = 'fireball';
      m.stateTimer = 45;
    }
    return;
  }

  if (m.isFlying) {
    if (r < 0.55) {
      m.state = 'fireball';
      m.stateTimer = 45;
    } else {
      m.state = 'swoop';
      m.stateTimer = 55;
    }
  } else {
    if (r < 0.25) {
      m.state = 'walk';
      m.stateTimer = 40;
    } else if (r < 0.55) {
      m.state = 'charge';
      m.stateTimer = 55;
    } else if (r < 0.82) {
      m.state = 'fireball';
      m.stateTimer = 45;
    } else {
      m.state = 'roar';
      m.stateTimer = 50;
    }
  }
}

function updateFireballs() {
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const fb = fireballs[i];
    fb.x += fb.vx;
    fb.y += fb.vy;
    addParticles(fb.x, fb.y, '#ff6600', 2, 2);

    const pBox = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };
    const fbBox = { x: fb.x - fb.r, y: fb.y - fb.r, w: fb.r * 2, h: fb.r * 2 };

    if (rectIntersect(fbBox, pBox)) {
      damagePlayer(22, true, false, false, false);
      addParticles(fb.x, fb.y, '#ff3300', 18, 6);
      fireballs.splice(i, 1);
      continue;
    }

    if (fb.y >= GROUND_Y || fb.x < 0 || fb.x > canvas.width) {
      addParticles(fb.x, fb.y, '#ff5500', 12, 4);
      fireballs.splice(i, 1);
    }
  }
}

function updatePoisonClouds() {
  for (let i = poisonClouds.length - 1; i >= 0; i--) {
    const pc = poisonClouds[i];
    pc.x += pc.vx;
    pc.y += pc.vy;
    addParticles(pc.x, pc.y, '#a020f0', 2, 2);

    const pBox = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };
    const pcBox = { x: pc.x - pc.r, y: pc.y - pc.r, w: pc.r * 2, h: pc.r * 2 };

    if (rectIntersect(pcBox, pBox)) {
      damagePlayer(18, false, true, false, false);
      addParticles(pc.x, pc.y, '#b829ff', 18, 6);
      poisonClouds.splice(i, 1);
      continue;
    }

    if (pc.y >= GROUND_Y || pc.x < 0 || pc.x > canvas.width) {
      addParticles(pc.x, pc.y, '#9932cc', 12, 4);
      poisonClouds.splice(i, 1);
    }
  }
}

function updateThunderOrbs() {
  for (let i = thunderOrbs.length - 1; i >= 0; i--) {
    const to = thunderOrbs[i];
    to.x += to.vx;
    to.y += to.vy;
    addParticles(to.x, to.y, '#00e5ff', 2, 2);

    const pBox = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };
    const toBox = { x: to.x - to.r, y: to.y - to.r, w: to.r * 2, h: to.r * 2 };

    if (rectIntersect(toBox, pBox)) {
      damagePlayer(20, false, false, true, false);
      addParticles(to.x, to.y, '#00e5ff', 18, 6);
      thunderOrbs.splice(i, 1);
      continue;
    }

    if (to.y >= GROUND_Y || to.x < 0 || to.x > canvas.width) {
      addParticles(to.x, to.y, '#00b8d4', 12, 4);
      thunderOrbs.splice(i, 1);
    }
  }
}

function updateThunderWaves() {
  const pBox = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };
  for (let i = thunderWaves.length - 1; i >= 0; i--) {
    const tw = thunderWaves[i];
    tw.x += tw.vx;
    if (Math.random() < 0.6) {
      addParticles(tw.x + tw.w / 2, GROUND_Y - 12, '#ffee58', 1, 2.5);
    }

    if (!tw.hasHit && rectIntersect(tw, pBox)) {
      tw.hasHit = true;
      damagePlayer(22, false, false, true, false);
      addParticles(tw.x + tw.w / 2, GROUND_Y - 18, '#ffee58', 16, 6);
    }

    if (tw.x < -60 || tw.x > canvas.width + 60) {
      thunderWaves.splice(i, 1);
    }
  }
}

function updateMizutsuneAttacks() {
  const pBox = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };

  for (let i = waterJets.length - 1; i >= 0; i--) {
    const wj = waterJets[i];
    wj.x += wj.vx;
    wj.y += wj.vy;
    addParticles(wj.x, wj.y, '#4fc3f7', 2, 2);

    const wjBox = { x: wj.x - wj.r, y: wj.y - wj.r, w: wj.r * 2, h: wj.r * 2 };
    if (rectIntersect(wjBox, pBox)) {
      damagePlayer(22, false, false, false, true);
      addParticles(wj.x, wj.y, '#81d4fa', 18, 6);
      waterJets.splice(i, 1);
      continue;
    }

    if (wj.x < -40 || wj.x > canvas.width + 40) {
      waterJets.splice(i, 1);
    }
  }

  for (let i = bubbleOrbs.length - 1; i >= 0; i--) {
    const bo = bubbleOrbs[i];
    bo.life--;
    bo.phase += 0.08;
    bo.x += bo.vx;
    bo.vy += 0.14;
    if (bo.y >= GROUND_Y - bo.r) {
      bo.y = GROUND_Y - bo.r;
      bo.vy = -Math.abs(bo.vy) * 0.85;
    }

    const boBox = { x: bo.x - bo.r, y: bo.y - bo.r, w: bo.r * 2, h: bo.r * 2 };
    if (rectIntersect(boBox, pBox)) {
      damagePlayer(15, false, false, false, true);
      addParticles(bo.x, bo.y, '#f8bbd0', 16, 5);
      bubbleOrbs.splice(i, 1);
      continue;
    }

    if (bo.life <= 0 || bo.x < -40 || bo.x > canvas.width + 40) {
      bubbleOrbs.splice(i, 1);
    }
  }
}

function updateLightningClouds() {
  for (let i = lightningClouds.length - 1; i >= 0; i--) {
    const lc = lightningClouds[i];
    lc.timer--;

    if (lc.timer % 8 === 0) {
      addParticles(lc.x + (Math.random() - 0.5) * 44, lc.y + 12, '#80d8ff', 1, 2);
    }

    if (lc.timer <= 0) {
      lightningBolts.push({
        x: lc.x,
        topY: lc.y + 8,
        bottomY: GROUND_Y,
        life: 14
      });
      screenShake = Math.max(screenShake, 7);
      addParticles(lc.x, GROUND_Y - 10, '#e1f5fe', 18, 6);

      const boltBox = { x: lc.x - 22, y: lc.y, w: 44, h: GROUND_Y - lc.y };
      const pBox = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };
      if (rectIntersect(boltBox, pBox)) {
        damagePlayer(24, false, false, true, false);
      }

      lightningClouds.splice(i, 1);
    }
  }

  for (let i = lightningBolts.length - 1; i >= 0; i--) {
    lightningBolts[i].life--;
    if (lightningBolts[i].life <= 0) {
      lightningBolts.splice(i, 1);
    }
  }
}

function updateFrenzyBombs() {
  for (let i = frenzyOrbs.length - 1; i >= 0; i--) {
    const orb = frenzyOrbs[i];
    orb.timer--;

    if (orb.timer % 6 === 0) {
      addParticles(orb.x + (Math.random() - 0.5) * 24, orb.y, '#aa00ff', 1, 2);
    }

    if (orb.timer <= 0) {
      const blastRadius = 56;
      frenzyExplosions.push({
        x: orb.x,
        y: GROUND_Y - 35,
        r: blastRadius,
        life: 16
      });
      screenShake = Math.max(screenShake, 9);
      addParticles(orb.x, GROUND_Y - 25, '#d500f9', 24, 7);
      addParticles(orb.x, GROUND_Y - 25, '#311b92', 14, 5);

      const blastBox = {
        x: orb.x - blastRadius,
        y: GROUND_Y - blastRadius * 1.4,
        w: blastRadius * 2,
        h: blastRadius * 1.4
      };
      const pBox = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };
      const anyFrenzied = activeMonsters.some(m => m.species === 'gore' && m.isFrenzied);
      if (rectIntersect(blastBox, pBox)) {
        damagePlayer(anyFrenzied ? 30 : 24, false, false, false, false);
      }

      frenzyOrbs.splice(i, 1);
    }
  }

  for (let i = frenzyExplosions.length - 1; i >= 0; i--) {
    frenzyExplosions[i].life--;
    if (frenzyExplosions[i].life <= 0) {
      frenzyExplosions.splice(i, 1);
    }
  }
}

function updateFrenzySpreadClouds() {
  let isStandingInSpread = false;
  const pBox = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };

  for (let i = frenzySpreadClouds.length - 1; i >= 0; i--) {
    const cloud = frenzySpreadClouds[i];
    cloud.timer--;

    if (cloud.timer % 5 === 0) {
      addParticles(cloud.x + Math.random() * cloud.w, cloud.y + Math.random() * cloud.h, '#9c27b0', 1, 1.5);
    }

    if (rectIntersect(cloud, pBox)) {
      isStandingInSpread = true;
    }

    if (cloud.timer <= 0) {
      frenzySpreadClouds.splice(i, 1);
    }
  }

  if (isStandingInSpread) {
    player.frenzyCloudTick++;
    if (player.frenzyCloudTick >= 20) {
      player.frenzyCloudTick = 0;
      player.hp = Math.max(0, player.hp - 1);
      addParticles(player.x + 15, player.y - 20, '#d500f9', 4, 2);
      addText('-1', player.x + 8, player.y - 62, '#e040fb', 15);
    }
  } else {
    player.frenzyCloudTick = 0;
  }
}

function updateBariothAttacks() {
  const pBox = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };

  for (let i = iceBeams.length - 1; i >= 0; i--) {
    const beam = iceBeams[i];
    beam.life--;

    if (!beam.hasHit && beam.life >= 10) {
      const pCenterX = player.x + player.w / 2;
      const pCenterY = player.y - player.h / 2;
      const t = Math.max(0, Math.min(1, ((pCenterX - beam.x1) * (beam.x2 - beam.x1) + (pCenterY - beam.y1) * (beam.y2 - beam.y1)) /
        (Math.pow(beam.x2 - beam.x1, 2) + Math.pow(beam.y2 - beam.y1, 2))));
      const closestX = beam.x1 + t * (beam.x2 - beam.x1);
      const closestY = beam.y1 + t * (beam.y2 - beam.y1);
      const dist = Math.hypot(pCenterX - closestX, pCenterY - closestY);

      if (dist <= 26) {
        beam.hasHit = true;
        damagePlayer(25, false, false, false, false);
        addParticles(pCenterX, pCenterY, '#80deea', 16, 6);
      }
    }

    if (beam.life <= 0) {
      iceBeams.splice(i, 1);
    }
  }

  for (let i = iceSpears.length - 1; i >= 0; i--) {
    const spear = iceSpears[i];

    if (spear.windupTimer > 0) {
      spear.windupTimer--;
      if (spear.windupTimer % 5 === 0) {
        addParticles(spear.dir === 1 ? spear.x + spear.w : spear.x, spear.y + spear.h / 2, '#b2ebf2', 2, 2);
      }
      continue;
    }

    spear.x += spear.vx;
    if (Math.random() < 0.5) {
      addParticles(spear.dir === 1 ? spear.x : spear.x + spear.w, spear.y + spear.h / 2, '#e0f7fa', 1, 2);
    }

    const spearBox = { x: spear.x, y: spear.y, w: spear.w, h: spear.h };
    if (!spear.hasHit && rectIntersect(spearBox, pBox)) {
      spear.hasHit = true;
      damagePlayer(24, false, false, false, false);
      addParticles(player.x + player.w / 2, spear.y + spear.h / 2, '#80deea', 18, 6);
    }

    if (spear.x > canvas.width + 160 || spear.x + spear.w < -160) {
      iceSpears.splice(i, 1);
    }
  }
}

function damagePlayer(amount, isFire, isPoison, isElectric, isBubble = false) {
  if (player.state === 'foresight' && player.stateTimer >= 12) {
    if (!player.foresightSuccess) {
      player.foresightSuccess = true;
      addText('キィィン！（見切り）', player.x, player.y - 70, '#00ffff', 18);
      addParticles(player.x + 15, player.y - 30, '#00ffff', 15, 6);
    }
    return;
  }

  if (player.invulnTimer > 0) return;

  const def = getTotalDefense();
  const fireRes = getTotalFireRes();
  const waterRes = getTotalWaterRes();
  const thunderRes = getTotalThunderRes();
  const defReduction = Math.round(def / 12);
  const fireReduction = isFire ? Math.floor(fireRes / 4) * 2 : 0;
  const waterReduction = isBubble ? Math.floor(waterRes / 4) * 2 : 0;
  const thunderReduction = isElectric ? Math.floor(thunderRes / 4) * 2 : 0;
  // 雷属性やられ中の効果：雷属性攻撃の被ダメージ +5
  const thunderBlightBonus = (isElectric && player.thunderBlightTimer > 0) ? 5 : 0;
  let finalDamage = Math.max(1, amount - defReduction - fireReduction - waterReduction - thunderReduction + thunderBlightBonus);

  const isTackleArmor = player.state === 'gsTackle';
  if (isTackleArmor) {
    finalDamage = Math.max(1, Math.floor(finalDamage * 0.5));
    player.hp = Math.max(0, player.hp - finalDamage);
    player.invulnTimer = 30;
    screenShake = 5;
    addText(`-${finalDamage} (タックル耐え)`, player.x - 10, player.y - 68, '#ffd54f', 18);
    addParticles(player.x + 15, player.y - 30, '#ffffff', 12, 5);
    return;
  }

  player.hp = Math.max(0, player.hp - finalDamage);
  player.invulnTimer = 45;
  player.state = 'hurt';
  player.stateTimer = 15;
  player.chargeLevel = 0;
  player.vx = -player.facing * 6;
  player.vy = -5;
  screenShake = 8;

  addText(`-${finalDamage}`, player.x, player.y - 65, '#ff3333', 22);
  if (isFire) {
    if (fireRes >= 20) {
      addText('火やられ無効！', player.x - 10, player.y - 85, '#ffab40', 16);
    } else {
      player.burnTimer = 240;
      addText('火属性やられ！', player.x - 10, player.y - 85, '#ff7700', 16);
    }
  }
  if (isBubble) {
    const wasBubbled = player.bubbleTimer > 0;
    if (!wasBubbled) {
      player.bubbleTimer = 480;
      addText('泡やられ！（8秒間滑る）', player.x - 20, player.y - 85, '#f48fb1', 16);
    } else {
      player.bubbleTimer = Math.max(player.bubbleTimer, 480);
    }

    const skills = getActiveSkills();
    if ((skills.bubblyDance || 0) >= 1) {
      player.bubblyBuffTimer = 1800; // 30秒間攻撃力1.05倍
      addText('泡沫の舞発動！(30秒間 攻撃1.05倍)', player.x - 36, player.y - 106, '#80deea', 16);
      addParticles(player.x + 15, player.y - 35, '#80deea', 18, 5);
    }
  }
  if (isPoison) {
    player.poisonTimer = 300;
    addText('毒状態！', player.x - 10, player.y - 85, '#d05ce3', 16);
  }
  if (isElectric) {
    if (thunderRes >= 20) {
      addText('雷やられ無効！', player.x - 10, player.y - 85, '#80d8ff', 16);
    } else {
      player.thunderBlightTimer = 240;
      addText('雷属性やられ！(雷被ダメ+5)', player.x - 24, player.y - 85, '#00e5ff', 16);
    }

    if (Math.random() < (1 / 8)) {
      const wasParalyzed = player.paralysisTimer > 0;
      player.paralysisTimer += 180;
      addText(wasParalyzed ? '麻痺延長！（+3秒）' : '麻痺状態！（3秒）', player.x - 20, player.y - 105, '#ffee00', 18);
      addParticles(player.x + 15, player.y - 30, '#ffee00', 20, 6);
    }
  }
}

function rectIntersect(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function draw() {
  if (gameState === 'questSelect') {
    drawQuestSelectScreen();
    if (isEquipMenuOpen) drawEquipMenu();
    if (isWeaknessGuideOpen) drawWeaknessGuide();
    return;
  }

  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    screenShake *= 0.85;
    if (screenShake < 0.5) screenShake = 0;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#3d2e22';
  ctx.fillRect(0, GROUND_Y, canvas.width, 6);

  drawLightningClouds();
  drawFrenzyBombs();
  drawFrenzySpreadClouds();

  activeMonsters.forEach(m => {
    if (m.hp > 0) {
      drawSingleMonster(m);
    }
  });

  drawThunderWaves();
  drawMizutsuneAttacks();
  drawBariothAttacks();

  if (typeof EXTRA_HOOKS.onDrawProjectiles === 'function') {
    EXTRA_HOOKS.onDrawProjectiles(getHookContext());
  }

  drawPlayer();
  drawLightningBolts();

  fireballs.forEach(fb => {
    ctx.beginPath();
    ctx.arc(fb.x, fb.y, fb.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ff4500';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(fb.x, fb.y, fb.r * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = '#ffee00';
    ctx.fill();
  });

  poisonClouds.forEach(pc => {
    ctx.beginPath();
    ctx.arc(pc.x, pc.y, pc.r, 0, Math.PI * 2);
    ctx.fillStyle = '#6a0dad';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(pc.x, pc.y, pc.r * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = '#da70d6';
    ctx.fill();
  });

  thunderOrbs.forEach(to => {
    ctx.beginPath();
    ctx.arc(to.x, to.y, to.r, 0, Math.PI * 2);
    ctx.fillStyle = '#0091ea';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(to.x, to.y, to.r * 0.6, 0, Math.PI * 2);
    ctx.fillStyle = '#e0f7fa';
    ctx.fill();
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 1.2;
    ft.life--;
    ctx.font = `bold ${ft.size}px sans-serif`;
    ctx.fillStyle = ft.color;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillText(ft.text, ft.x, ft.y);
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  ctx.restore();

  drawUI();

  if (isEquipMenuOpen) {
    drawEquipMenu();
  }

  if (isWeaknessGuideOpen) {
    drawWeaknessGuide();
  }
}

function drawThunderWaves() {
  thunderWaves.forEach(tw => {
    ctx.save();
    ctx.shadowColor = '#ffee58';
    ctx.shadowBlur = 14;
    ctx.fillStyle = 'rgba(255, 238, 88, 0.78)';
    ctx.beginPath();
    ctx.moveTo(tw.x, GROUND_Y);
    ctx.lineTo(tw.x + tw.w * 0.3, tw.y + 8);
    ctx.lineTo(tw.x + tw.w * 0.55, tw.y);
    ctx.lineTo(tw.x + tw.w * 0.8, tw.y + 10);
    ctx.lineTo(tw.x + tw.w, GROUND_Y);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(tw.x + 8, GROUND_Y - 12, tw.w - 16, 10);
    ctx.restore();
  });
}

function drawMizutsuneAttacks() {
  waterJets.forEach(wj => {
    ctx.save();
    ctx.shadowColor = '#29b6f6';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#0288d1';
    ctx.beginPath();
    ctx.ellipse(wj.x, wj.y, wj.r * 1.8, wj.r * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e1f5fe';
    ctx.beginPath();
    ctx.ellipse(wj.x, wj.y, wj.r * 1.1, wj.r * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  bubbleOrbs.forEach(bo => {
    ctx.save();
    ctx.shadowColor = '#f48fb1';
    ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(248, 187, 208, 0.45)';
    ctx.beginPath();
    ctx.arc(bo.x, bo.y, bo.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#fce4ec';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(bo.x - bo.r * 0.35, bo.y - bo.r * 0.35, bo.r * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawQuestSelectScreen() {
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bg.addColorStop(0, '#1e1812');
  bg.addColorStop(1, '#120e0b');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#8a6d3b';
  ctx.lineWidth = 3;
  ctx.strokeRect(14, 14, canvas.width - 28, canvas.height - 28);

  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 26px sans-serif';
  ctx.fillText('【 討伐クエスト選択ボード 】', 34, 54);

  const wpn = getCurrentWeapon();
  const typeLabel = getWeaponTypeLabel();
  const totalAtk = getTotalAttack();
  ctx.textAlign = 'right';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#ffd54f';
  ctx.fillText(`現在装備: [${typeLabel}] ${wpn.name} (攻${totalAtk} / ${wpn.elementLabel})`, canvas.width - 34, 42);
  ctx.fillStyle = '#a5d6a7';
  ctx.fillText(`防具: ${getEquipSummaryText()}`, canvas.width - 34, 62);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#ccc';
  ctx.font = '13px sans-serif';
  ctx.fillText('モンスターをクリックして出撃！（Ctrl: 装備変更 / F2: 弱点肉質表 / Q・E: ページ切替）', 36, 90);

  const totalPages = Math.ceil(QUEST_LIST.length / QUESTS_PER_PAGE);
  const btnRects = getPageBtnRects();
  const btnLabels = ['◀ 前へ', '次へ ▶'];
  btnRects.forEach((br, bi) => {
    const isBtnHover = hoveredPageBtn === bi;
    ctx.fillStyle = isBtnHover ? '#4a3b28' : '#2a2219';
    ctx.fillRect(br.x, br.y, br.w, br.h);
    ctx.strokeStyle = isBtnHover ? '#ffd700' : '#8a6d3b';
    ctx.lineWidth = isBtnHover ? 2 : 1.5;
    ctx.strokeRect(br.x, br.y, br.w, br.h);

    ctx.fillStyle = isBtnHover ? '#ffd700' : '#eee';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(btnLabels[bi], br.x + br.w / 2, br.y + 19);
    ctx.textAlign = 'left';
  });

  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${questPage + 1} / ${totalPages}`, 759, 91);
  ctx.textAlign = 'left';

  const pageStart = questPage * QUESTS_PER_PAGE;
  const pageEnd = Math.min(QUEST_LIST.length, pageStart + QUESTS_PER_PAGE);
  for (let idx = pageStart; idx < pageEnd; idx++) {
    const q = QUEST_LIST[idx];
    const slotIdx = idx - pageStart;
    const r = getQuestCardRect(slotIdx);
    const isHover = idx === hoveredQuestIndex;

    ctx.fillStyle = isHover ? '#2e251c' : '#211b15';
    ctx.fillRect(r.x, r.y, r.w, r.h);

    ctx.fillStyle = q.themeColor;
    ctx.fillRect(r.x, r.y, 10, r.h);

    ctx.strokeStyle = isHover ? '#ffd700' : '#5c4934';
    ctx.lineWidth = isHover ? 3 : 1.5;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    const badgeW = 54;
    const badgeH = 26;
    const badgeX = r.x + 22;
    const badgeY = r.y + 14;
    ctx.fillStyle = q.starLevel >= 3 ? '#6a1b9a' : (q.starLevel >= 2 ? '#b71c1c' : '#2e7d32');
    ctx.fillRect(badgeX, badgeY, badgeW, badgeH);
    ctx.strokeStyle = q.starLevel >= 3 ? '#ea80fc' : (q.starLevel >= 2 ? '#ff8a80' : '#a5d6a7');
    ctx.lineWidth = 1;
    ctx.strokeRect(badgeX, badgeY, badgeW, badgeH);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(q.stars, badgeX + badgeW / 2, badgeY + 19);
    ctx.textAlign = 'left';

    ctx.fillStyle = isHover ? '#ffd700' : '#ffffff';
    ctx.font = 'bold 19px sans-serif';
    ctx.fillText(q.title, badgeX + badgeW + 12, r.y + 34);

    ctx.fillStyle = '#bbb';
    ctx.font = '13px sans-serif';
    ctx.fillText(q.tag, r.x + 24, r.y + 66);

    ctx.textAlign = 'right';
    ctx.fillStyle = q.borderColor;
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(q.hpText, r.x + r.w - 16, r.y + 34);

    if (isHover) {
